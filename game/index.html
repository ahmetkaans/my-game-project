<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>My Game Project</title>
<script>
  // Apply the saved theme before first paint (see DESIGN.md "Light and dark mode").
  try {
    var savedTheme = localStorage.getItem('lg-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
  } catch (e) { /* storage unavailable: follow the device */ }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="css/colors.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/quiz.css">
<link rel="stylesheet" href="css/results.css">
<link rel="stylesheet" href="css/dialogs.css">
</head>
<body>

<header class="topbar" id="topbar">
  <button class="icon-btn" id="home-btn" type="button" title="Main menu" aria-label="Main menu" data-i18n-label="mainMenu"></button>
  <button class="icon-btn" id="tree-btn" type="button" title="Menu tree" aria-label="Menu tree" data-i18n-label="menuTree"></button>
  <button class="icon-btn" id="settings-btn" type="button" title="Settings" aria-label="Settings" data-i18n-label="settings"></button>
</header>

<main id="app">

  <!-- Screen: level selection (root, no back button) -->
  <section id="screen-level" class="screen">
    <h1>My Game Project</h1>
    <p class="subtitle" data-i18n="chooseLevel">Choose your level.</p>
    <div id="level-buttons"></div>
  </section>

  <!-- Screen: category (Vocabulary / Grammar) -->
  <section id="screen-category" class="screen" hidden>
    <button class="back-btn" data-back="level" data-i18n="backArrow">&larr; Back</button>
    <h1 data-i18n="practiceTitle">What do you want to practice?</h1>
    <p class="breadcrumb"></p>
    <div class="grid" id="category-buttons"></div>
  </section>

  <!-- Screen: topic -->
  <section id="screen-topic" class="screen" hidden>
    <button class="back-btn" data-back="category" data-i18n="backArrow">&larr; Back</button>
    <h1 data-i18n="topicTitle">Choose a topic</h1>
    <p class="breadcrumb"></p>
    <div class="grid" id="topic-buttons"></div>
  </section>

  <!-- Screen: question type -->
  <section id="screen-type" class="screen" hidden>
    <button class="back-btn" data-back="topic" data-i18n="backArrow">&larr; Back</button>
    <h1 data-i18n="typeTitle">Choose a question type</h1>
    <p class="breadcrumb"></p>
    <div class="grid" id="type-buttons"></div>
  </section>

  <!-- Screen: difficulty + same-duration switch -->
  <section id="screen-difficulty" class="screen" hidden>
    <button class="back-btn" data-back="type" data-i18n="backArrow">&larr; Back</button>
    <h1 data-i18n="difficultyTitle">Choose a difficulty</h1>
    <p class="breadcrumb"></p>
    <div class="grid" id="difficulty-buttons"></div>
    <label class="switch-row">
      <span class="switch">
        <input type="checkbox" id="same-duration-switch">
        <span class="slider"></span>
      </span>
      <span data-i18n="sameDuration">Same duration per question across all difficulty settings</span>
    </label>
  </section>

  <!-- Screen: quiz (game page: no credits, no top bar) -->
  <section id="screen-quiz" class="screen" hidden>
    <button class="back-btn" id="quiz-quit" data-i18n="backArrow">&larr; Back</button>
    <p class="breadcrumb"></p>
    <div class="quiz-meta">
      <span id="quiz-progress"></span>
      <span id="quiz-score"></span>
      <span id="quiz-timer-text"></span>
    </div>
    <div class="timer-bar" id="quiz-timer-bar"><div class="timer-fill" id="quiz-timer-fill"></div></div>
    <div id="quiz-question" class="card" lang="en"></div>
    <div id="quiz-feedback" class="feedback" hidden></div>
    <button id="quiz-next" class="primary" hidden>Next</button>
  </section>

  <!-- Screen: results -->
  <section id="screen-results" class="screen" hidden>
    <button class="back-btn" data-back="difficulty" data-i18n="backArrow">&larr; Back</button>
    <h1 data-i18n="resultsTitle">Your results</h1>
    <p class="breadcrumb"></p>
    <div class="card results-hero">
      <p class="results-score" id="results-score"></p>
      <ul class="results-summary" id="results-summary"></ul>
      <div class="actions">
        <button class="primary" id="results-next" data-i18n="nextExercise">Next exercise</button>
        <button id="results-retry" data-i18n="retry">Retry</button>
        <button id="results-home" data-i18n="mainMenu">Main menu</button>
      </div>
    </div>
    <ol class="results-list" id="results-list"></ol>
  </section>

</main>

<footer id="credits-footer">
  <button class="link-btn" id="credits-btn" data-i18n="credits">Credits</button>
</footer>

<div class="tree-overlay" id="tree-overlay" hidden>
  <aside class="tree-panel" role="dialog" aria-modal="true" aria-labelledby="tree-title">
    <div class="tree-head">
      <h2 id="tree-title" data-i18n="treeTitle">Where you are</h2>
      <button type="button" class="tree-close" id="tree-close" data-i18n="close">Close</button>
    </div>
    <ol class="tree" id="tree-list"></ol>
  </aside>
</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <button type="button" class="icon-btn" id="modal-back" title="Back" aria-label="Back" data-i18n-label="back" hidden></button>
      <h2 id="modal-title"></h2>
    </div>
    <div id="modal-body"></div>
    <div class="actions" id="modal-actions"></div>
  </div>
</div>

// The text for `key` in the chosen language (English if a Turkish text is missing). {name} is replaced from params.
function t(key, params) {
  let text = I18N[state.lang] && I18N[state.lang][key];
  if (text === undefined) text = I18N.en[key];
  if (text === undefined) {
    console.warn(`Missing text: ${key}`);
    return key;
  }
  return params ? text.replace(/\{(\w+)\}/g, (match, name) => (name in params ? params[name] : match)) : text;
}

/* =========================================================================
 * STATE
 * ========================================================================= */
const state = {
  nav: { level: null, category: null, topic: null, type: null, difficulty: null, sameDuration: false },
  quiz: null, // created by startQuiz()
  smartBoard: false, // SmartBoard mode (Settings): Fill in the Blanks uses taps instead of typing; remembered ('lg-smartboard')
  lang: 'en', // language of menus, buttons and pop-ups (Settings): 'en' or 'tr'; remembered ('lg-lang'); set by initLanguage()
  screen: 'level', // the screen being shown (set by showScreen)
  nextHint: null, // { difficulty }: the quiz "Next exercise" suggests; marked on the Difficulty screen, cleared on any other screen
};

/* =========================================================================
 * HELPERS
 * ========================================================================= */
const $ = (sel) => document.querySelector(sel);

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === 'text') node.textContent = value;
    else if (key === 'class') node.className = value;
    else if (key === 'disabled') node.disabled = value;
    else node.setAttribute(key, value);
  }
  for (const child of [].concat(children)) {
    node.append(child);
  }
  return node;
}

// Scores are kept exact (e.g. 3 × 33.33…); round away float noise, show at most 2 decimals (6.25, 33.33).
// Display only: in Turkish the decimal sign is a comma (6,25). Stored numbers always keep the dot.
function fmt(n) {
  const r = Math.round(n * 1e6) / 1e6;
  const text = String(Number(r.toFixed(2)));
  return state.lang === 'tr' ? text.replace('.', ',') : text;
}

// English content (a question, an answer, an explanation) inside a Turkish line says so with lang="en".
function englishText(text) {
  return el('span', { lang: 'en', text });
}

// A record's note is stored as { key, params } (not as a sentence), so it can be shown in either language later.
function noteText(note) {
  return t(note.key, note.params);
}

function clampScore(n) {
  return Math.min(CONFIG.SCORE_MAX, Math.max(CONFIG.SCORE_MIN, Math.round(n * 1e6) / 1e6));
}

function findById(list, id) {
  return list.find((item) => item.id === id);
}

// localStorage can throw (private mode, blocked storage): always fall back silently.
function loadPref(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : value;
  } catch (e) {
    return fallback;
  }
}

function savePref(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* ignore */ }
}

function prefersReducedMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// Seeded RNG so the same quiz (level/category/topic/type) always yields the same questions.
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeLorem(rng) {
  const int = (min, max) => min + Math.floor(rng() * (max - min + 1));
  const shuffle = (arr) => {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };
  const words = (n) => shuffle(LOREM_WORDS).slice(0, n);
  const capitalize = (w) => w.charAt(0).toUpperCase() + w.slice(1);
  const sentence = (min, max, end = '.') => {
    const w = words(int(min, max));
    w[0] = capitalize(w[0]);
    return w.join(' ') + end;
  };
  return { int, shuffle, words, capitalize, sentence, bool: () => rng() < 0.5 };
}

/* =========================================================================
 * LANGUAGE  (English / Turkish, chosen in Settings, remembered in localStorage "lg-lang")
 * ========================================================================= */
function initLanguage() {
  const saved = loadPref('lg-lang', 'en');
  state.lang = LANGS.includes(saved) ? saved : 'en';
}

// Static texts carry data-i18n="key" (their text) or data-i18n-label="key" (tooltip and screen reader name).
// <html lang> follows the language; English content (questions, topic names, the word list) carries lang="en" itself.
function applyStaticTexts() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach((node) => { node.textContent = t(node.dataset.i18n); });
  document.querySelectorAll('[data-i18n-label]').forEach((node) => {
    const label = t(node.dataset.i18nLabel);
    node.title = label;
    node.setAttribute('aria-label', label);
  });
}

function setLanguage(lang, save = true) {
  if (!LANGS.includes(lang) || lang === state.lang) return;
  state.lang = lang;
  if (save) savePref('lg-lang', lang);
  applyStaticTexts();
  renderMenus();
  renderDifficultyButtons();
  refreshBreadcrumb();
  // Settings is the only pop-up that can be open now: its texts change in place, so the toggle keeps its slide and its focus.
  if (modalState.kind === 'settings' && !$('#modal-overlay').hidden) translateSettings();
  // The results screen is built from the quiz record: build it again in the new language.
  if (state.screen === 'results' && state.quiz) renderResultsContent();
}

/* =========================================================================
 * THEME  (Auto / Light / Dark, chosen in Settings, remembered in localStorage "lg-theme")
 * ========================================================================= */
const THEMES = ['auto', 'light', 'dark'];
let currentTheme = 'auto';

function setTheme(theme, save = true) {
  if (!THEMES.includes(theme)) theme = 'auto';
  currentTheme = theme;
  if (theme === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  if (save) savePref('lg-theme', theme);

}

function initTheme() {
  setTheme(loadPref('lg-theme', 'auto'), false);
}

/* =========================================================================
 * SOUND  (Web Audio API, no files; mute remembered in localStorage "lg-muted")
 * ========================================================================= */
const sound = { ctx: null, muted: loadPref('lg-muted', '0') === '1' };

// Each note: { freq, endFreq?, type?, start (s), duration (s), gain }
const SOUNDS = {
  correct: [
    { freq: 659.25, type: 'sine', start: 0, duration: 0.5, gain: 0.12 },
    { freq: 987.77, type: 'sine', start: 0.09, duration: 0.7, gain: 0.09 },
  ],
  partial: [
    { freq: 587.33, type: 'sine', start: 0, duration: 0.45, gain: 0.1 },
  ],
  wrong: [
    { freq: 220, endFreq: 174.6, type: 'triangle', start: 0, duration: 0.45, gain: 0.13 },
  ],
  tick: [
    { freq: 1250, type: 'sine', start: 0, duration: 0.05, gain: 0.035 },
  ],
};

function getAudio() {
  if (sound.muted) return null;
  if (!sound.ctx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;
    sound.ctx = new AudioCtx();
  }
  if (sound.ctx.state === 'suspended') sound.ctx.resume();
  return sound.ctx;
}

function playNote(ctx, note) {
  const t0 = ctx.currentTime + note.start;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = note.type || 'sine';
  osc.frequency.setValueAtTime(note.freq, t0);
  if (note.endFreq) osc.frequency.exponentialRampToValueAtTime(note.endFreq, t0 + note.duration);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(note.gain, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + note.duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + note.duration + 0.05);
}

function playSound(name) {
  const ctx = getAudio();
  if (!ctx) return;
  SOUNDS[name].forEach((note) => playNote(ctx, note));
}

function setMuted(muted) {
  sound.muted = muted;
  savePref('lg-muted', muted ? '1' : '0');
  refreshSettings();
}

function initSound() {
  // Browsers only allow audio after a user gesture: create/resume the context on the first one.
  const unlock = () => { if (!sound.muted) getAudio(); };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);
}

/* =========================================================================
 * CONFETTI  (results screen, high score only, skipped with reduced motion)
 * ========================================================================= */
let confetti = null;

function launchConfetti() {
  stopConfetti();
  if (prefersReducedMotion()) return;
  const canvas = el('canvas', { class: 'confetti', 'aria-hidden': 'true' });
  document.body.append(canvas);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const width = window.innerWidth;
  const height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);

  const styles = getComputedStyle(document.documentElement);
  const colors = CONFIG.LEVELS.map((l) => styles.getPropertyValue(`--lvl-${l}`).trim());
  const pieces = Array.from({ length: CONFIG.CONFETTI_COUNT }, () => ({
    x: Math.random() * width,
    y: -20 - Math.random() * height * 0.4,
    w: 6 + Math.random() * 4,
    h: 8 + Math.random() * 6,
    vx: (Math.random() - 0.5) * 1.2,
    vy: 1.8 + Math.random() * 2.2,
    rot: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.15,
    color: colors[Math.floor(Math.random() * colors.length)],
  }));

  const start = performance.now();
  confetti = { canvas, raf: 0 };
  const frame = (now) => {
    const elapsed = now - start;
    if (elapsed >= CONFIG.CONFETTI_MS) {
      stopConfetti();
      return;
    }
    const fadeStart = CONFIG.CONFETTI_MS - 700;
    ctx.globalAlpha = elapsed > fadeStart ? 1 - (elapsed - fadeStart) / 700 : 1;
    ctx.clearRect(0, 0, width, height);
    for (const p of pieces) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    confetti.raf = requestAnimationFrame(frame);
  };
  confetti.raf = requestAnimationFrame(frame);
}

function stopConfetti() {
  if (!confetti) return;
  cancelAnimationFrame(confetti.raf);
  confetti.canvas.remove();
  confetti = null;
}

/* =========================================================================
 * QUESTIONS
 * ========================================================================= */
function quizKey(nav) {
  return `${nav.level}|${nav.category}|${nav.topic}|${nav.type}|${nav.difficulty}`;
}

// Stored shapes: the correct answer is first (mc options[0], fill bank[0]); prepareQuiz() shuffles.
function getQuestions(nav) {
  const bank = QUESTION_BANK[quizKey(nav)];
  if (nav.type === 'match') {
    // Matching quizzes have a variable length: use every question of the entry.
    if (bank && bank.length >= CONFIG.MATCH_MIN_QUESTIONS) return bank;
  } else if (bank && bank.length >= CONFIG.QUESTIONS_PER_QUIZ) {
    return bank.slice(0, CONFIG.QUESTIONS_PER_QUIZ);
  }
  return generateLoremQuestions(nav);
}

function generateLoremQuestions(nav) {
  const L = makeLorem(mulberry32(hashString(quizKey(nav))));
  const count = nav.type === 'match'
    ? L.int(CONFIG.MATCH_MIN_QUESTIONS, CONFIG.MATCH_MAX_LOREM_QUESTIONS)
    : CONFIG.QUESTIONS_PER_QUIZ;
  const questions = [];
  for (let i = 0; i < count; i++) {
    const explanation = L.sentence(10, 16);
    if (nav.type === 'mc') {
      questions.push({ type: 'mc', prompt: L.sentence(6, 10, '?'), options: L.words(CONFIG.MC_OPTIONS), explanation });
    } else if (nav.type === 'tf') {
      const prompt = L.sentence(6, 10);
      questions.push({ type: 'tf', prompt, answer: i % 2 === 0, target: prompt.split(' ')[1], explanation });
    } else if (nav.type === 'fill') {
      const length = L.int(6, 9);                        // words in sentence incl. the blank
      const bankSize = L.int(CONFIG.FILL_BANK_MIN, CONFIG.FILL_BANK_MAX);
      const all = L.words(length - 1 + bankSize);
      const sentenceWords = all.slice(0, length - 1);
      const bankWords = all.slice(length - 1);           // bankWords[0] is the answer
      const pos = L.int(1, length - 2);                  // blank never first or last
      sentenceWords[0] = L.capitalize(sentenceWords[0]);
      questions.push({
        type: 'fill',
        before: sentenceWords.slice(0, pos).join(' '),
        after: sentenceWords.slice(pos).join(' ') + '.',
        answer: bankWords[0],
        bank: bankWords,
        explanation,
      });
    } else if (nav.type === 'match') {
      const w = L.words(CONFIG.MATCH_PAIRS * 2);
      const pairs = [];
      for (let p = 0; p < CONFIG.MATCH_PAIRS; p++) pairs.push({ left: w[p], right: w[p + CONFIG.MATCH_PAIRS] });
      questions.push({ type: 'match', prompt: L.sentence(5, 8), pairs, explanation });
    }
  }
  // Lorem true/false: 4 true and 4 false in a mixed (seeded) order, like real quizzes.
  return nav.type === 'tf' ? L.shuffle(questions) : questions;
}

/*
 * Mindful shuffling, seeded by the quiz key so Retry shows exactly the same quiz.
 * Returns copies; the stored questions are never changed.
 * - mc: each position holds the correct answer equally often (8 questions → each position twice),
 *       never more than MC_MAX_SAME_POSITION_IN_A_ROW times in a row. Sets q.answer (index).
 * - fill: bank order shuffled.
 * - match: right-side order shuffled, never the same order as the left side. Sets q.rightOrder.
 */
function prepareQuiz(questions, key) {
  const L = makeLorem(mulberry32(hashString(`shuffle|${key}`)));
  const mcCount = questions.filter((q) => q.type === 'mc').length;
  const positions = balancedPositions(mcCount, CONFIG.MC_OPTIONS, CONFIG.MC_MAX_SAME_POSITION_IN_A_ROW, L);
  let mcIndex = 0;
  return questions.map((q) => {
    if (q.type === 'mc') {
      const [correct, ...wrong] = q.options;
      const options = L.shuffle(wrong);
      const answer = positions[mcIndex++];
      options.splice(answer, 0, correct);
      return { ...q, options, answer };
    }
    if (q.type === 'fill') return { ...q, bank: L.shuffle(q.bank) };
    if (q.type === 'match') {
      const identity = q.pairs.map((_, i) => i);
      let order = L.shuffle(identity);
      while (order.every((v, i) => v === i)) order = L.shuffle(identity);
      return { ...q, rightOrder: order };
    }
    return { ...q };
  });
}

function balancedPositions(count, slots, maxRun, L) {
  const list = Array.from({ length: count }, (_, i) => i % slots);
  const runTooLong = (arr) => arr.some((_, i) => i >= maxRun && arr.slice(i - maxRun, i + 1).every((v) => v === arr[i]));
  let order = L.shuffle(list);
  for (let tries = 0; tries < 200 && runTooLong(order); tries++) order = L.shuffle(list);
  return order;
}

// Spelling: optimal string alignment distance (insert, delete, replace, or swap of two neighbors = 1).
function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
  }
  return d[a.length][b.length];
}

function normalizeAnswer(text) {
  return text.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[‘’]/g, "'");
}

// Typed fill answer → 'correct' | 'misspelled' | 'incorrect' (see README.md "Typed Fill in the Blanks").
function judgeFill(input, q) {
  const typed = normalizeAnswer(input);
  const answer = normalizeAnswer(q.answer);
  const others = q.bank.map(normalizeAnswer).filter((w) => w !== answer);
  if (typed === answer) return 'correct';
  if (others.includes(typed)) return 'incorrect';
  if (answer.length <= CONFIG.SPELL_EXACT_MAX_LENGTH) return 'incorrect'; // very short answers (hi, oh, one, six) must be exact: one wrong letter often makes another real word
  const allowed = answer.length <= CONFIG.SPELL_SHORT_MAX_LENGTH ? CONFIG.SPELL_MAX_EDITS_SHORT : CONFIG.SPELL_MAX_EDITS_LONG;
  const toAnswer = editDistance(typed, answer);
  const closerToAnswer = others.every((w) => toAnswer < editDistance(typed, w));
  return toAnswer <= allowed && closerToAnswer ? 'misspelled' : 'incorrect';
}

function questionText(q) {
  if (q.type === 'fill') return `${fillBefore(q.before)}___${fillAfter(q.after)}`;
  return q.prompt;
}

function correctAnswerText(q) {
  if (q.type === 'mc') return q.options[q.answer];
  if (q.type === 'tf') return q.answer ? 'True' : 'False';
  if (q.type === 'fill') return q.answer;
  if (q.type === 'match') return q.pairs.map((p) => `${p.left} → ${p.right}`).join('; ');
  return '';
}

/* =========================================================================
 * NAVIGATION / MENUS
 * ========================================================================= */
const SCREEN_DEPTH = { level: 0, category: 1, topic: 2, type: 3, difficulty: 4, quiz: 5, results: 5 };

function breadcrumbParts() {
  const nav = state.nav;
  return [
    nav.level,
    nav.category ? t(`category.${nav.category}`) : null,
    nav.topic !== null ? getTopics(nav)[nav.topic] : null,
    nav.type ? t(`type.${nav.type}`) : null,
    nav.difficulty ? `${t(`difficulty.${nav.difficulty}`)} (${t('secondsShort', { n: getQuestionSeconds() })})` : null,
  ];
}

// The path line (Level › Category › …) of the screen being shown.
function refreshBreadcrumb() {
  const crumb = $(`#screen-${state.screen} .breadcrumb`);
  if (crumb) crumb.textContent = breadcrumbParts().slice(0, SCREEN_DEPTH[state.screen]).join(' › ');
}

function showScreen(name) {
  state.screen = name;
  stopConfetti();
  if (name !== 'difficulty') state.nextHint = null;
  document.querySelectorAll('.screen').forEach((s) => { s.hidden = s.id !== `screen-${name}`; });
  // Level accent: neutral on the level screen, the chosen level's color everywhere inside a level.
  if (name === 'level') delete document.body.dataset.level;
  else if (state.nav.level) document.body.dataset.level = state.nav.level;
  // Credits and the theme/mute bar are shown on every page except the game (quiz) page.
  $('#credits-footer').hidden = name === 'quiz';
  $('#topbar').hidden = name === 'quiz';
  $('#home-btn').hidden = name === 'level'; // already on the main menu
  refreshBreadcrumb();
  if (name === 'difficulty') renderDifficultyButtons();
  window.scrollTo(0, 0);
}

function renderButtons(container, items, onClick) {
  container.replaceChildren(...items.map((item) => {
    const btn = el('button', { class: 'menu-btn' }, [item.label]);
    if (item.lang) btn.lang = item.lang; // text that is not translated (topic names) says so
    if (item.sub) btn.append(el('small', { text: item.sub }));
    if (item.tag) {
      btn.classList.add('is-next');
      btn.append(el('span', { class: 'next-tag', text: item.tag }));
    }
    btn.addEventListener('click', () => onClick(item));
    return btn;
  }));
}

function getQuestionSeconds() {
  if (state.nav.sameDuration) return CONFIG.SAME_DURATION_SECONDS;
  return findById(CONFIG.DIFFICULTIES, state.nav.difficulty).seconds;
}

// The "same duration" switch lives on the Difficulty screen and in Settings; both always show this one value.
function setSameDuration(value, save = true) {
  state.nav.sameDuration = value;
  if (save) savePref('lg-same-duration', value ? '1' : '0');
  $('#same-duration-switch').checked = value;
  renderDifficultyButtons();
  refreshSettings();
}

function renderDifficultyButtons() {
  const items = CONFIG.DIFFICULTIES.map((d) => ({
    ...d,
    label: t(`difficulty.${d.id}`),
    sub: t('secondsShort', { n: state.nav.sameDuration ? CONFIG.SAME_DURATION_SECONDS : d.seconds }),
    tag: state.nextHint && state.nextHint.difficulty === d.id ? t('nextTag') : null,
  }));
  renderButtons($('#difficulty-buttons'), items, (d) => {
    state.nav.difficulty = d.id;
    startQuiz();
  });
}

/* =========================================================================
 * NEXT EXERCISE  (results screen: difficulty -> question type -> topic; the student chooses at the end of a category)
 * ========================================================================= */
// The next quiz after `nav`: { nav } for the next quiz, { options: [{ nav }] } when the category's topics are finished
// (the student decides where to go), or null after the very last quiz.
function getNextExercise(nav) {
  const diffs = CONFIG.DIFFICULTIES;
  const types = CONFIG.TYPES;
  const d = diffs.findIndex((x) => x.id === nav.difficulty);
  if (d < diffs.length - 1) return { nav: { ...nav, difficulty: diffs[d + 1].id } };
  const t = types.findIndex((x) => x.id === nav.type);
  if (t < types.length - 1) return { nav: { ...nav, type: types[t + 1].id, difficulty: diffs[0].id } };
  if (nav.topic < getTopics(nav).length - 1) {
    return { nav: { ...nav, topic: nav.topic + 1, type: types[0].id, difficulty: diffs[0].id } };
  }
  const start = (level, category) => ({ ...nav, level, category, topic: 0, type: types[0].id, difficulty: diffs[0].id });
  const c = CONFIG.CATEGORIES.findIndex((x) => x.id === nav.category);
  const l = CONFIG.LEVELS.indexOf(nav.level);
  const options = [];
  if (c < CONFIG.CATEGORIES.length - 1) options.push({ nav: start(nav.level, CONFIG.CATEGORIES[c + 1].id) });
  if (l < CONFIG.LEVELS.length - 1) options.push({ nav: start(CONFIG.LEVELS[l + 1], CONFIG.CATEGORIES[0].id) });
  return options.length ? { options } : null;
}

function levelCategoryLabel(nav) {
  return `${nav.level} ${t(`category.${nav.category}`)}`;
}

/* =========================================================================
 * MODAL
 * ========================================================================= */
const modalState = { dismissible: false, opener: null, kind: null }; // kind: 'settings' while Settings is open (it is built again when the language changes)

// While a pop-up or the menu tree is open, the page behind it can't be reached with the keyboard
// (Tab, Shift+Tab) or a screen reader: it is made `inert`. Called whenever either one opens or closes.
function updateInert() {
  const active = !$('#modal-overlay').hidden || $('#tree-overlay').classList.contains('is-open');
  ['#topbar', '#app', '#credits-footer'].forEach((sel) => { $(sel).inert = active; });
}

// onBack (optional): shows a left arrow button before the title that runs it (used by the "Words in this game" pop-up).
function openModal({ title, body, buttons, dismissible = false, onBack = null, kind = null }) {
  modalState.kind = kind;
  $('#modal-title').textContent = title;
  $('#modal-back').hidden = !onBack;
  $('#modal-back').onclick = onBack;
  $('#modal-body').replaceChildren(typeof body === 'string' ? el('p', { text: body }) : body);
  $('#modal-actions').replaceChildren(...buttons.map((b) => {
    const btn = el('button', { class: b.primary ? 'primary' : '', text: b.label });
    btn.addEventListener('click', b.onClick);
    return btn;
  }));
  if ($('#modal-overlay').hidden) modalState.opener = document.activeElement; // focus goes back here when it closes
  modalState.dismissible = dismissible;
  $('#modal-overlay').hidden = false;
  updateInert();
  $('#modal-overlay .modal').scrollTop = 0; // a long pop-up (the word list) always opens at its top
  const focusTarget = $('#modal-actions .primary') || $('#modal-actions button');
  if (focusTarget) focusTarget.focus({ preventScroll: true }); // focusing the button must not scroll the pop-up down to it
}

function closeModal() {
  if ($('#modal-overlay').hidden) return;
  $('#modal-overlay').hidden = true;
  modalState.kind = null;
  updateInert();
  const opener = modalState.opener;
  modalState.opener = null;
  if (opener && opener.isConnected && !opener.disabled) opener.focus({ preventScroll: true });
}

function openCredits() {
  openModal({
    title: t('credits'),
    body: el('ul', {}, CREDITS.map((name) => el('li', { text: name }))),
    buttons: [{ label: t('close'), primary: true, onClick: closeModal }],
    dismissible: true,
  });
}

/* =========================================================================
 * SETTINGS  (pop-up: language, theme, sound, same duration, SmartBoard mode; each remembered in localStorage)
 * ========================================================================= */
let settingsUi = null; // controls of the open Settings pop-up, kept in step by refreshSettings()

function refreshSettings() {
  if (!settingsUi) return;
  const isTurkish = state.lang === 'tr';
  settingsUi.languageToggle.setAttribute('aria-checked', String(isTurkish));
  settingsUi.languageToggle.setAttribute('aria-label', `${t('languageName')}: ${LANG_NAMES[state.lang]}`);
  settingsUi.languageToggle.querySelectorAll('.lang-lbl').forEach((lbl, i) => lbl.classList.toggle('is-on', LANGS[i] === state.lang));
  settingsUi.themeButtons.forEach((btn, i) => btn.setAttribute('aria-pressed', String(THEMES[i] === currentTheme)));
  settingsUi.soundSwitch.checked = !sound.muted;
  settingsUi.durationSwitch.checked = state.nav.sameDuration;
  settingsUi.smartBoardSwitch.checked = state.smartBoard;
  // A quiz always runs in one mode: the switch is locked while a quiz is on screen.
  const locked = state.screen === 'quiz';
  settingsUi.smartBoardSwitch.disabled = locked;
  settingsUi.smartBoardLock.hidden = !locked;
}

function setSmartBoard(value, save = true) {
  state.smartBoard = value;
  if (save) savePref('lg-smartboard', value ? '1' : '0');
  refreshSettings();
}

// A text of the Settings pop-up: `texts` remembers [node, key, params] so translateSettings() can set it again.
function settingText(texts, tag, attrs, key, params) {
  const node = el(tag, attrs, [t(key, params)]);
  texts.push([node, key, params]);
  return node;
}

function settingSwitch(texts, id, nameKey, helpKey, helpParams, onChange) {
  const input = el('input', { type: 'checkbox', 'aria-describedby': `${id}-help` });
  input.addEventListener('change', () => onChange(input.checked));
  const row = el('div', { class: 'setting' }, [
    el('label', { class: 'setting-head' }, [
      settingText(texts, 'span', { class: 'setting-name' }, nameKey),
      el('span', { class: 'switch' }, [input, el('span', { class: 'slider' })]),
    ]),
    settingText(texts, 'p', { class: 'setting-help', id: `${id}-help` }, helpKey, helpParams),
  ]);
  return { row, input };
}

// The Language toggle: a sliding pill with both names always shown. A tap on a half chooses that side;
// Left / Right choose a side, Space / Enter switch to the other one.
function languageToggle() {
  const toggle = el('div', {
    class: 'lang-toggle', id: 'setting-language', role: 'switch', tabindex: '0', 'aria-checked': 'false',
    'aria-describedby': 'setting-language-help',
  }, [
    el('span', { class: 'lang-thumb' }),
    ...LANGS.map((lang) => el('span', { class: 'lang-lbl', lang, text: LANG_NAMES[lang] })),
  ]);
  toggle.addEventListener('click', (e) => {
    const box = toggle.getBoundingClientRect();
    setLanguage(e.clientX - box.left > box.width / 2 ? 'tr' : 'en');
  });
  toggle.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') setLanguage(state.lang === 'en' ? 'tr' : 'en');
    else if (e.key === 'ArrowLeft') setLanguage('en');
    else if (e.key === 'ArrowRight') setLanguage('tr');
    else return;
    e.preventDefault();
  });
  return toggle;
}

// Sets every text of the open Settings pop-up again (the language changed) without rebuilding it,
// so the Language toggle keeps its place and its slide plays.
function translateSettings() {
  settingsUi.texts.forEach(([node, key, params]) => { node.textContent = t(key, params); });
  $('#modal-title').textContent = t('settings');
  $('#modal-actions button').textContent = t('close');
  refreshSettings();
}

function openSettings() {
  const texts = [];
  const languageControl = languageToggle();
  const languageRow = el('div', { class: 'setting' }, [
    el('div', { class: 'setting-head can-wrap' }, [settingText(texts, 'span', { class: 'setting-name' }, 'languageName'), languageControl]),
    settingText(texts, 'p', { class: 'setting-help', id: 'setting-language-help' }, 'languageHelp'),
  ]);
  const themeButtons = THEMES.map((theme) => {
    const btn = el('button', { type: 'button', 'aria-pressed': 'false' }, [settingText(texts, 'span', {}, `theme.${theme}`)]);
    btn.insertAdjacentHTML('afterbegin', ICONS[theme]);
    btn.addEventListener('click', () => setTheme(theme));
    return btn;
  });
  const themeRow = el('div', { class: 'setting' }, [
    el('div', { class: 'setting-head' }, [settingText(texts, 'span', { class: 'setting-name', id: 'setting-theme-name' }, 'themeName')]),
    el('div', { class: 'segmented', role: 'group', 'aria-labelledby': 'setting-theme-name', 'aria-describedby': 'setting-theme-help' }, themeButtons),
    settingText(texts, 'p', { class: 'setting-help', id: 'setting-theme-help' }, 'themeHelp'),
  ]);
  const soundRow = settingSwitch(texts, 'setting-sound', 'soundName', 'soundHelp', null, (on) => setMuted(!on));
  const durationRow = settingSwitch(texts, 'setting-duration', 'sameDuration', 'durationHelp',
    { n: CONFIG.SAME_DURATION_SECONDS }, (on) => setSameDuration(on));
  const smartBoardRow = settingSwitch(texts, 'setting-smartboard', 'smartBoardName', 'smartBoardHelp', null, (on) => setSmartBoard(on));
  const smartBoardLock = settingText(texts, 'p', { class: 'setting-help' }, 'smartBoardLock');
  smartBoardRow.row.append(smartBoardLock);
  settingsUi = { texts, languageToggle: languageControl, themeButtons, soundSwitch: soundRow.input,
    durationSwitch: durationRow.input, smartBoardSwitch: smartBoardRow.input, smartBoardLock };
  refreshSettings();
  openModal({
    title: t('settings'),
    body: el('div', {}, [
      el('div', { class: 'settings' }, [languageRow, themeRow, soundRow.row, durationRow.row, smartBoardRow.row]),
      settingText(texts, 'p', { class: 'settings-note' }, 'workInProgress'),
    ]),
    buttons: [{ label: t('close'), primary: true, onClick: closeModal }],
    dismissible: true,
    kind: 'settings',
  });
}

/* =========================================================================
 * MENU TREE  (the student's path through the menu; a chosen step opens that menu screen)
 * ========================================================================= */
const TREE_STEPS = [
  { screen: 'level' },
  { screen: 'category' },
  { screen: 'topic' },
  { screen: 'type' },
  { screen: 'difficulty' },
];
let treeCloseTimer = null;

function renderTree() {
  const values = breadcrumbParts();
  const depth = Math.min(SCREEN_DEPTH[state.screen], TREE_STEPS.length); // how many steps are chosen on this screen
  const current = Math.min(depth, TREE_STEPS.length - 1);                // the step being chosen (the last one on results)
  $('#tree-list').replaceChildren(...TREE_STEPS.map((step, i) => {
    const chosen = i < depth;
    const value = el('span', { class: 'val', text: chosen ? values[i] : t('notChosen') });
    if (i === current) value.append(el('span', { class: 'tree-here', text: t('youAreHere') }));
    const btn = el('button', { type: 'button', class: 'tree-step' }, [el('span', { class: 'cap', text: t(`step.${step.screen}`) }), value]);
    if (i === current) btn.setAttribute('aria-current', 'step');
    if (chosen) {
      btn.addEventListener('click', () => {
        closeTree();
        if (step.screen !== state.screen) showScreen(step.screen);
      });
    } else {
      btn.disabled = true;
    }
    const cls = [i === current ? 'is-current' : '', chosen ? '' : 'is-pending'].join(' ').trim();
    return el('li', { class: cls, style: `--depth:${i};--i:${i}` }, [btn]);
  }));
}

function openTree() {
  clearTimeout(treeCloseTimer);
  renderTree();
  const overlay = $('#tree-overlay');
  overlay.hidden = false;
  void overlay.offsetWidth; // let the browser draw the closed position first, so the slide-in plays
  overlay.classList.add('is-open');
  updateInert();
  $('#tree-close').focus();
}

function closeTree() {
  const overlay = $('#tree-overlay');
  if (overlay.hidden) return;
  overlay.classList.remove('is-open');
  updateInert();
  clearTimeout(treeCloseTimer);
  treeCloseTimer = setTimeout(() => { overlay.hidden = true; }, CONFIG.TREE_CLOSE_MS); // a timer, so it also hides with reduced motion
  $('#tree-btn').focus(); // back to the button that opened it (a click doesn't focus buttons in every browser)
}

function initTree() {
  const home = $('#home-btn');
  home.innerHTML = ICONS.home;
  home.addEventListener('click', openHomeConfirm);
  const btn = $('#tree-btn');
  btn.innerHTML = ICONS.tree;
  btn.addEventListener('click', openTree);
  $('#tree-close').addEventListener('click', closeTree);
  $('#tree-overlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeTree(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#tree-overlay').hidden) closeTree();
  });
}

function initModal() {
  $('#modal-back').innerHTML = ICONS.back;
  $('#modal-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget && modalState.dismissible) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#modal-overlay').hidden && modalState.dismissible) closeModal();
  });
}

/* =========================================================================
 * QUIZ FLOW
 * ========================================================================= */
function startQuiz() {
  stopTimer();
  closeModal();
  const questions = prepareQuiz(getQuestions(state.nav), quizKey(state.nav));
  state.quiz = {
    questions,
    index: 0,
    score: 0,                                   // raw running score, may go negative
    graded: !CONFIG.UNGRADED_TYPES.includes(state.nav.type),
    records: questions.map(() => ({
      status: 'unanswered',                     // correct | partial | incorrect | skipped | unanswered
      userAnswer: null,
      note: null,                               // partial: { key, params } of a text (spellingWarning / pairsCorrect), shown by noteText()
      points: 0,                                // points from answering
      penalty: 0,                               // points lost to the time extension
      extensionUsed: false,
      timedOut: false,                          // true if this question ended the game
    })),
    timer: { totalMs: 0, remainingMs: 0, intervalId: null, lastTs: 0, extension: false, lastTickSecond: null },
    answered: false,                            // current question locked?
    over: false,
    ui: {},                                     // per-question renderer state
  };
  showScreen('quiz');
  // The "Words in this game" pop-up comes first (also on Retry); the timer starts when it closes.
  $('#quiz-question').replaceChildren();
  $('#quiz-feedback').hidden = true;
  $('#quiz-next').hidden = true;
  openWordPreview(() => { closeModal(); renderQuestion(); });
}

// The words a quiz tests, in order of appearance, without repeats: [{ word, type }].
// type = the word type used in this quiz (q.targetType / pair.type); needed when a word has several types.
// q.target (optional on mc / fill) = the dictionary form when the answer is another form ("laughs" -> "laugh").
function quizTargetWords(questions) {
  const words = new Map();
  const add = (word, type) => { if (word && !words.has(word)) words.set(word, { word, type: type || null }); };
  questions.forEach((q) => {
    if (q.type === 'mc') add(q.target || q.options[q.answer], q.targetType);
    else if (q.type === 'fill') add(q.target || q.answer, q.targetType);
    else if (q.type === 'tf') add(q.target, q.targetType);
    else if (q.type === 'match') q.pairs.forEach((p) => add(p.left, p.type));
  });
  return [...words.values()];
}

// All senses of a word from GLOSSARY[level]: [{ type, meaning }]. An entry is one sense (object) or several
// (array, one per word type). Lorem quizzes get a lorem placeholder.
function glossarySenses(level, word) {
  const entry = (GLOSSARY[level] || {})[word.toLowerCase()];
  if (entry) return [].concat(entry);
  const L = makeLorem(mulberry32(hashString(`glossary|${word}`)));
  return [{ type: L.words(1)[0], meaning: L.sentence(3, 6, '') }];
}

function openWordPreview(start) {
  const level = state.nav.level;
  const list = el('ul', { class: 'word-list', lang: 'en' }, quizTargetWords(state.quiz.questions).map(({ word, type }) => {
    const senses = glossarySenses(level, word);
    const used = type || senses[0].type;   // one sense: that one is used
    // Every word type of the word is shown; the one used in this game is underlined.
    return el('li', {}, [
      el('span', { class: 'word', text: word }),
      ...senses.map((s) => el('p', { class: 'word-sense' }, [
        el('span', { class: `word-type${s.type === used ? ' is-used' : ''}`, text: s.type }),
        ` ${s.meaning}`,
      ])),
    ]);
  }));
  openModal({
    title: t('wordsTitle'),
    body: list,
    buttons: [{ label: t('start'), primary: true, onClick: start }],
    // The arrow leaves before the quiz begins: same place as Quit, the Difficulty screen (nothing was answered yet)
    onBack: () => { closeModal(); state.quiz = null; showScreen('difficulty'); },
  });
}

function currentQuestion() {
  return state.quiz.questions[state.quiz.index];
}

function currentRecord() {
  return state.quiz.records[state.quiz.index];
}

function renderQuestion() {
  const quiz = state.quiz;
  const q = currentQuestion();
  quiz.answered = false;
  quiz.ui = {};
  $('#quiz-progress').textContent = t('questionOf', { n: quiz.index + 1, total: quiz.questions.length });
  updateScoreDisplay();
  $('#quiz-feedback').hidden = true;
  $('#quiz-next').hidden = true;
  const area = $('#quiz-question');
  area.replaceChildren();
  (q.type === 'fill' && state.smartBoard ? renderFillTap : RENDERERS[q.type])(q, area);
  startTimer(getQuestionSeconds(), false);
}

function updateScoreDisplay() {
  const quiz = state.quiz;
  $('#quiz-score').textContent = quiz.graded ? `${t('score')}: ${fmt(quiz.score)}` : t('scoreNotGraded');
}

/*
 * outcome: 'correct' | 'partial' | 'incorrect'. points: what the answer earns (renderers compute it,
 * see questionPoints()). note: { key, params } of a text, shown for partial answers (spelling warning, pairs count).
 */
function submitAnswer(outcome, userAnswer, points, note = null) {
  const quiz = state.quiz;
  if (!quiz || quiz.answered) return;
  quiz.answered = true;
  stopTimer();

  const q = currentQuestion();
  const rec = currentRecord();
  rec.status = outcome;
  rec.userAnswer = userAnswer;
  rec.note = note;
  if (quiz.graded) {
    rec.points = points;
    quiz.score += rec.points;
  }
  updateScoreDisplay();
  playSound({ correct: 'correct', partial: 'partial', incorrect: 'wrong' }[outcome]);

  const area = $('#quiz-question');
  area.querySelectorAll('button, input').forEach((b) => { b.disabled = true; });
  // Renderers mark the right element(s) with .is-correct before calling submitAnswer.
  if (outcome === 'correct') area.querySelectorAll('.is-correct').forEach((node) => node.classList.add('pop'));

  const fb = $('#quiz-feedback');
  fb.className = `feedback ${{ correct: 'ok', partial: 'partial', incorrect: 'bad' }[outcome]}`;
  const heading = t({ correct: 'feedback.correct', partial: q.type === 'fill' ? 'feedback.almost' : 'feedback.partial', incorrect: 'feedback.incorrect' }[outcome]);
  const lines = [el('p', {}, [el('strong', { text: heading })])];
  if (note) lines.push(el('p', { text: noteText(note) }));
  // The answer and the explanation are English content: they carry lang="en" inside the (maybe Turkish) line.
  const labelled = (key, value) => el('p', {}, [`${t(key)}: `, englishText(value)]);
  if (outcome === 'correct') {
    lines.push(labelled('answer', correctAnswerText(q)));
  } else {
    lines.push(labelled('correctAnswer', correctAnswerText(q)));
    lines.push(labelled('explanation', q.explanation));
  }
  if (quiz.graded) lines.push(el('p', { class: 'points', text: `${t('points')}: ${points > 0 ? '+' : ''}${fmt(points)}` }));
  fb.replaceChildren(...lines);
  fb.hidden = false;

  const next = $('#quiz-next');
  next.textContent = t(quiz.index === quiz.questions.length - 1 ? 'seeResults' : 'next');
  next.hidden = false;
  next.focus();
}

function goNext() {
  const quiz = state.quiz;
  if (quiz.index < quiz.questions.length - 1) {
    quiz.index++;
    renderQuestion();
  } else {
    showResults();
  }
}

function skipQuestion() {
  const quiz = state.quiz;
  quiz.answered = true;
  currentRecord().status = 'skipped';
  goNext();
}

function requestQuit() {
  const quiz = state.quiz;
  const wasRunning = quiz.timer.intervalId !== null;
  pauseTimer();
  openModal({
    title: t('quitTitle'),
    body: t('quitBody'),
    buttons: [
      { label: t('cancel'), primary: true, onClick: () => { closeModal(); if (wasRunning) resumeTimer(); } },
      { label: t('quit'), onClick: () => { closeModal(); stopTimer(); state.quiz = null; showScreen('difficulty'); } },
    ],
  });
}

/* =========================================================================
 * TIMER  (time-based, so pausing keeps the exact remaining milliseconds)
 * ========================================================================= */
function startTimer(seconds, extension) {
  stopTimer();
  const t = state.quiz.timer;
  t.totalMs = seconds * 1000;
  t.remainingMs = t.totalMs;
  t.extension = extension;
  t.lastTickSecond = null;
  resumeTimer();
}

function resumeTimer() {
  const t = state.quiz.timer;
  if (t.intervalId !== null || t.remainingMs <= 0) return;
  t.lastTs = performance.now();
  t.intervalId = setInterval(tick, CONFIG.TIMER_TICK_MS);
  renderTimer();
}

function pauseTimer() {
  const t = state.quiz && state.quiz.timer;
  if (!t || t.intervalId === null) return;
  t.remainingMs = Math.max(0, t.remainingMs - (performance.now() - t.lastTs));
  stopTimer();
}

function stopTimer() {
  const t = state.quiz && state.quiz.timer;
  if (!t || t.intervalId === null) return;
  clearInterval(t.intervalId);
  t.intervalId = null;
}

function tick() {
  const quiz = state.quiz;
  if (!quiz) return;
  const t = quiz.timer;
  const now = performance.now();
  t.remainingMs -= now - t.lastTs;
  t.lastTs = now;
  if (t.remainingMs <= 0) {
    t.remainingMs = 0;
    stopTimer();
    renderTimer();
    onTimeUp();
    return;
  }
  // Quiet tick once per second in the last TICK_LAST_SECONDS (normal and extra time).
  const secondsLeft = Math.ceil(t.remainingMs / 1000);
  if (secondsLeft <= CONFIG.TICK_LAST_SECONDS && secondsLeft !== t.lastTickSecond) {
    t.lastTickSecond = secondsLeft;
    playSound('tick');
  }
  renderTimer();
}

function renderTimer() {
  const timer = state.quiz.timer; // not named `t`: that is the text function
  const ratio = timer.totalMs ? timer.remainingMs / timer.totalMs : 0;
  const text = $('#quiz-timer-text');
  text.textContent = `${t(timer.extension ? 'extraTime' : 'time')}: ${t('secondsShort', { n: Math.ceil(timer.remainingMs / 1000) })}`;
  text.classList.toggle('is-extension', timer.extension);
  $('#quiz-timer-fill').style.width = `${ratio * 100}%`;
  const bar = $('#quiz-timer-bar');
  bar.classList.toggle('is-extension', timer.extension);
  bar.classList.toggle('is-low', !timer.extension && ratio < CONFIG.TIMER_LOW_RATIO);
}

function onTimeUp() {
  const quiz = state.quiz;
  if (quiz.answered) return;
  const rec = currentRecord();
  if (!rec.extensionUsed) {
    openModal({
      title: t('timeOutTitle'),
      body: t(quiz.graded ? 'timeOutBodyPts' : 'timeOutBody', { n: CONFIG.EXTENSION_SECONDS, p: CONFIG.EXTENSION_PENALTY }),
      buttons: [
        {
          label: t(quiz.graded ? 'plusSecondsPts' : 'plusSeconds', { n: CONFIG.EXTENSION_SECONDS, p: CONFIG.EXTENSION_PENALTY }),
          primary: true,
          onClick: () => { closeModal(); useExtension(); },
        },
        { label: t('skipQuestion'), onClick: () => { closeModal(); skipQuestion(); } },
      ],
    });
  } else {
    gameOver();
  }
}

function useExtension() {
  const quiz = state.quiz;
  const rec = currentRecord();
  rec.extensionUsed = true;
  if (quiz.graded) {
    rec.penalty = -CONFIG.EXTENSION_PENALTY;
    quiz.score += rec.penalty;
  }
  updateScoreDisplay();
  startTimer(CONFIG.EXTENSION_SECONDS, true);
}

function gameOver() {
  const quiz = state.quiz;
  quiz.answered = true;
  quiz.over = true;
  currentRecord().timedOut = true;
  $('#quiz-question').querySelectorAll('button, input').forEach((b) => { b.disabled = true; });
  openModal({
    title: t('gameOverTitle'),
    body: t('gameOverBody'),
    buttons: [
      { label: t('retry'), primary: true, onClick: () => { closeModal(); startQuiz(); } },
      { label: t('seeResults'), onClick: () => { closeModal(); showResults(); } },
    ],
  });
}

/* =========================================================================
 * RENDERERS (one per question type)
 * ========================================================================= */
function renderChoiceButtons(area, labels, correctIndex, onPick, extraClass = '') {
  const wrap = el('div', { class: `options ${extraClass}`.trim() });
  labels.forEach((label, i) => {
    const btn = el('button', { class: 'option', text: label });
    btn.addEventListener('click', () => {
      if (state.quiz.answered) return;
      const correct = i === correctIndex;
      btn.classList.add(correct ? 'is-correct' : 'is-wrong');
      wrap.children[correctIndex].classList.add('is-correct');
      onPick(correct, label);
    });
    wrap.append(btn);
  });
  area.append(wrap);
}

// Points for multiple choice / true or false / fill: +POINTS_CORRECT or −POINTS_INCORRECT.
function choicePoints(correct) {
  return correct ? CONFIG.POINTS_CORRECT : -CONFIG.POINTS_INCORRECT;
}

function submitChoice(correct, label) {
  submitAnswer(correct ? 'correct' : 'incorrect', label, choicePoints(correct));
}

function renderMC(q, area) {
  area.append(el('p', { class: 'prompt', text: q.prompt }));
  renderChoiceButtons(area, q.options, q.answer, submitChoice);
}

function renderTF(q, area) {
  area.append(el('p', { class: 'prompt', text: q.prompt }));
  renderChoiceButtons(area, ['True', 'False'], q.answer ? 0 : 1, submitChoice, 'two');
}

// Typed fill: the word bank is shown above the sentence; the student types one word into the blank.
// Spaces around the blank like normal print: none after an opening quote ("___) and none before
// punctuation or a closing quote (___. / ___!" / ___,).
function fillBefore(text) { return !text || text.endsWith('"') ? text || '' : `${text} `; }
function fillAfter(text) { return !text || /^[.,!?;:"']/.test(text) ? text || '' : ` ${text}`; }

function renderFill(q, area) {
  const bank = el('div', { class: 'word-bank' }, q.bank.map((word) => el('span', { class: 'chip', text: word })));
  const input = el('input', {
    class: 'blank-input',
    type: 'text',
    autocomplete: 'off',
    autocorrect: 'off',
    autocapitalize: 'off',
    spellcheck: 'false',
    enterkeyhint: 'done',
    'aria-label': t('yourAnswer'),
  });
  const check = el('button', { class: 'primary check-btn', text: t('check'), disabled: true });
  const submit = () => {
    const typed = input.value.trim();
    if (!typed || state.quiz.answered) return;
    const result = judgeFill(typed, q);
    if (result === 'correct') {
      input.classList.add('is-correct');
      submitAnswer('correct', typed, CONFIG.POINTS_CORRECT);
    } else if (result === 'misspelled') {
      input.classList.add('is-partial');
      submitAnswer('partial', typed, CONFIG.POINTS_CORRECT * CONFIG.FILL_MISSPELLED_SHARE,
        { key: 'spellingWarning', params: { answer: q.answer, typed } });
    } else {
      input.classList.add('is-wrong');
      submitAnswer('incorrect', typed, -CONFIG.POINTS_INCORRECT);
    }
  };
  input.addEventListener('input', () => { check.disabled = !input.value.trim(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  check.addEventListener('click', submit);
  area.append(
    el('p', { class: 'instructions', text: t('typeInstruction') }),
    bank,
    el('p', { class: 'prompt fill-sentence' }, [fillBefore(q.before), input, fillAfter(q.after)]),
    check,
  );
  state.quiz.ui = { input, check };
  input.focus({ preventScroll: true });
}

// SmartBoard mode: the same question, answered with taps. Tap a bank word and it goes into the blank;
// tap the placed word (or the blank) to take it back. No "misspelled" case: the word is right or wrong.
function renderFillTap(q, area) {
  const ui = { placed: null }; // index into q.bank of the word in the blank
  const chips = q.bank.map((word, i) => {
    const chip = el('button', { class: 'chip', type: 'button', text: word });
    chip.addEventListener('click', () => {
      if (state.quiz.answered) return;
      ui.placed = ui.placed === i ? null : i;         // tapping a word puts it in the blank (replacing another); tapping the placed one takes it back
      refresh();
    });
    return chip;
  });
  const slot = el('button', { class: 'blank-slot', type: 'button', 'aria-label': t('theBlank') });
  slot.addEventListener('click', () => {
    if (state.quiz.answered) return;
    ui.placed = null;                                 // tapping the word in the blank takes it out
    refresh();
  });
  const check = el('button', { class: 'primary check-btn', text: t('check'), disabled: true });
  const refresh = () => {
    chips.forEach((chip, i) => chip.classList.toggle('is-used', ui.placed === i));
    slot.textContent = ui.placed === null ? '' : q.bank[ui.placed];
    slot.classList.toggle('is-filled', ui.placed !== null);
    check.disabled = ui.placed === null;
  };
  check.addEventListener('click', () => {
    if (ui.placed === null || state.quiz.answered) return;
    const word = q.bank[ui.placed];
    if (normalizeAnswer(word) === normalizeAnswer(q.answer)) {
      slot.classList.add('is-correct');
      submitAnswer('correct', word, CONFIG.POINTS_CORRECT);
    } else {
      slot.classList.add('is-wrong');
      submitAnswer('incorrect', word, -CONFIG.POINTS_INCORRECT);
    }
  });
  area.append(
    el('p', { class: 'instructions', text: t('tapInstruction') }),
    el('div', { class: 'word-bank' }, chips),
    el('p', { class: 'prompt fill-sentence' }, [fillBefore(q.before), slot, fillAfter(q.after)]),
    check,
  );
  state.quiz.ui = ui;
  refresh();
}

function renderMatch(q, area) {
  const ui = { selectedLeft: null, pairs: new Map(), leftBtns: [], rightBtns: [] };
  const leftCol = el('div', { class: 'match-col' });
  const rightCol = el('div', { class: 'match-col' });

  const refresh = () => {
    ui.leftBtns.forEach((btn, i) => {
      btn.classList.toggle('is-selected', ui.selectedLeft === i);
      if (ui.pairs.has(i)) btn.dataset.pair = i + 1; else delete btn.dataset.pair;
    });
    ui.rightBtns.forEach((btn, ri) => {
      const left = [...ui.pairs].find(([, r]) => r === ri);
      if (left) btn.dataset.pair = left[0] + 1; else delete btn.dataset.pair;
    });
    ui.check.disabled = ui.pairs.size !== q.pairs.length;
  };

  q.pairs.forEach((pair, i) => {
    const btn = el('button', { class: 'match-item', text: pair.left });
    btn.addEventListener('click', () => {
      if (state.quiz.answered) return;
      if (ui.pairs.has(i)) {
        ui.pairs.delete(i);                       // clicking a paired item undoes the pair
        ui.selectedLeft = null;
      } else {
        ui.selectedLeft = ui.selectedLeft === i ? null : i;
      }
      refresh();
    });
    ui.leftBtns[i] = btn;
    leftCol.append(btn);
  });

  q.rightOrder.forEach((ri) => {
    const btn = el('button', { class: 'match-item', text: q.pairs[ri].right });
    btn.addEventListener('click', () => {
      if (state.quiz.answered) return;
      const existing = [...ui.pairs].find(([, r]) => r === ri);
      if (existing) {
        ui.pairs.delete(existing[0]);
      } else if (ui.selectedLeft !== null) {
        ui.pairs.set(ui.selectedLeft, ri);
        ui.selectedLeft = null;
      }
      refresh();
    });
    ui.rightBtns[ri] = btn;
    rightCol.append(btn);
  });

  ui.check = el('button', { class: 'primary check-btn', text: t('check'), disabled: true });
  ui.check.addEventListener('click', () => {
    if (state.quiz.answered) return;
    let correctPairs = 0;
    q.pairs.forEach((_, i) => {
      const ri = ui.pairs.get(i);
      const ok = ri === i;
      if (ok) correctPairs++;
      ui.leftBtns[i].classList.add(ok ? 'is-correct' : 'is-wrong');
      ui.rightBtns[ri].classList.add(ok ? 'is-correct' : 'is-wrong');
    });
    const userAnswer = q.pairs.map((p, i) => `${p.left} → ${q.pairs[ui.pairs.get(i)].right}`).join('; ');
    // Partial points: the quiz is worth SCORE_MAX in total; each correct pair earns its share. No penalty.
    const points = (CONFIG.SCORE_MAX / state.quiz.questions.length) * (correctPairs / q.pairs.length);
    const outcome = correctPairs === q.pairs.length ? 'correct' : correctPairs > 0 ? 'partial' : 'incorrect';
    const note = outcome === 'partial' ? { key: 'pairsCorrect', params: { n: correctPairs, total: q.pairs.length } } : null;
    submitAnswer(outcome, userAnswer, points, note);
  });

  area.append(
    el('p', { class: 'prompt', text: q.prompt }),
    el('div', { class: 'match-columns' }, [leftCol, rightCol]),
    ui.check,
  );
  state.quiz.ui = ui;
  refresh();
}

const RENDERERS = { mc: renderMC, tf: renderTF, fill: renderFill, match: renderMatch };

/* =========================================================================
 * RESULTS
 * ========================================================================= */
function statusLabel(rec, graded, type) {
  const pts = (n) => (graded ? ` (${n > 0 ? '+' : ''}${fmt(n)})` : ` (${t('notGraded')})`);
  if (rec.status === 'correct') return `${t('status.correct')}${pts(rec.points)}`;
  if (rec.status === 'partial') return `${t(type === 'fill' ? 'status.misspelled' : 'status.partial')}${pts(rec.points)}`;
  if (rec.status === 'incorrect') return `${t('status.incorrect')}${pts(rec.points)}`;
  if (rec.status === 'skipped') return t('status.skipped');
  return t(rec.timedOut ? 'status.timedOut' : 'status.unanswered');
}

// Builds everything on the results screen from state.quiz. Runs again when the language changes on this screen
// (no timer, screen change or confetti involved).
function renderResultsContent() {
  const quiz = state.quiz;
  const counts = { correct: 0, partial: 0, incorrect: 0, skipped: 0, unanswered: 0 };
  quiz.records.forEach((r) => { counts[r.status]++; });
  const finalScore = clampScore(quiz.score);
  const type = state.nav.type;

  $('#results-score').replaceChildren(...(quiz.graded
    ? [el('span', { class: 'score-num', text: fmt(finalScore) }), el('span', { class: 'score-max', text: ` / ${CONFIG.SCORE_MAX}` })]
    : [el('span', { class: 'score-na', text: t('scoreNotGraded') })]));
  $('#results-summary').replaceChildren(
    el('li', { text: `${t('count.correct')}: ${counts.correct}` }),
    ...(counts.partial ? [el('li', { text: `${t(type === 'fill' ? 'count.misspelled' : 'count.partial')}: ${counts.partial}` })] : []),
    el('li', { text: `${t('count.incorrect')}: ${counts.incorrect}` }),
    el('li', { text: `${t('count.skipped')}: ${counts.skipped}` }),
    el('li', { text: `${t('count.unanswered')}: ${counts.unanswered}` }),
  );

  $('#results-list').replaceChildren(...quiz.questions.map((q, i) => {
    const rec = quiz.records[i];
    const row = (label, value) => el('p', {}, [el('span', { class: 'label', text: `${label}: ` }), value]);
    const children = [
      el('p', {}, [el('strong', {}, [`${t('questionNumber', { n: i + 1 })} `, englishText(questionText(q))])]),
      row(t('yourAnswer'), englishText(rec.userAnswer ?? '—')),
      row(t('correctAnswer'), englishText(correctAnswerText(q))),
      row(t('result'), statusLabel(rec, quiz.graded, q.type)),
    ];
    if (rec.note) children.push(row(t('note'), noteText(rec.note)));
    if (rec.extensionUsed) {
      children.push(row(t('extraTime'), quiz.graded ? `${t('used')} (${fmt(rec.penalty)})` : t('used')));
    }
    children.push(row(t('explanation'), englishText(q.explanation)));
    return el('li', { class: `st-${rec.status}` }, children);
  }));

  $('#results-next').hidden = !getNextExercise(state.nav);   // hidden after the very last quiz
}

function showResults() {
  stopTimer();
  const quiz = state.quiz;
  renderResultsContent();
  showScreen('results');
  const finalScore = clampScore(quiz.score);
  const minScore = state.nav.type === 'match' ? CONFIG.CONFETTI_MIN_MATCH_SCORE : CONFIG.CONFETTI_MIN_SCORE;
  if (quiz.graded && finalScore >= minScore) launchConfetti();
}

/* =========================================================================
 * INIT
 * ========================================================================= */
initLanguage();
initTheme();
initSound();
initMenus();
initModal();
initTree();
applyStaticTexts();
showScreen('level');
</script>
