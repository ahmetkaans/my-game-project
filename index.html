<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>My Game Project</title>
<script>
  // Apply the saved theme before first paint (see DESIGN.md "Light and dark mode").
  try {
    var savedTheme = localStorage.getItem('lg-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
  } catch (e) { /* storage unavailable: follow the device */ }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
  /* Design language: see DESIGN.md. Change token values here, not inline. */
  :root {
    --lvl-A1: #0F7A6C;
    --lvl-A2: #2F6FB8;
    --lvl-B1: #6B4FC0;
    --lvl-B2: #A8436F;
    --lvl-C1: #A0670B;
    --neutral-accent: #44505C;

    --bg: #F6F6F3;
    --surface: #FFFFFF;
    --fg: #1D2125;
    --muted: #5F6670;
    --border: #E3E3DE;
    --ok: #1E7B3C;
    --bad: #B3261E;
    --extra: #C2410C;
    --on-accent: #FFFFFF;
    --knob: #FFFFFF;
    --shadow: 0 1px 2px rgba(20, 24, 28, 0.05), 0 4px 16px rgba(20, 24, 28, 0.05);
    --shadow-lg: 0 8px 32px rgba(20, 24, 28, 0.16);
    --overlay: rgba(20, 24, 28, 0.45);
    --tint: 7%;
    --soft: 12%;

    --accent: var(--neutral-accent);
    --radius: 14px;
    --radius-sm: 10px;
    --gap: 12px;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --lvl-A1: #5CC9B8;
      --lvl-A2: #7DB1EC;
      --lvl-B1: #A894EE;
      --lvl-B2: #E89BBB;
      --lvl-C1: #E7B54F;
      --neutral-accent: #B4BEC9;
      --bg: #121417;
      --surface: #1A1D21;
      --fg: #E6E8EB;
      --muted: #9AA1AA;
      --border: #2C3137;
      --ok: #6CCB8A;
      --bad: #F08A80;
      --extra: #FB923C;
      --on-accent: #121417;
      --knob: #E6E8EB;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
      --overlay: rgba(0, 0, 0, 0.6);
      --tint: 10%;
      --soft: 18%;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --lvl-A1: #5CC9B8;
    --lvl-A2: #7DB1EC;
    --lvl-B1: #A894EE;
    --lvl-B2: #E89BBB;
    --lvl-C1: #E7B54F;
    --neutral-accent: #B4BEC9;
    --bg: #121417;
    --surface: #1A1D21;
    --fg: #E6E8EB;
    --muted: #9AA1AA;
    --border: #2C3137;
    --ok: #6CCB8A;
    --bad: #F08A80;
    --extra: #FB923C;
    --on-accent: #121417;
    --knob: #E6E8EB;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
    --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
    --overlay: rgba(0, 0, 0, 0.6);
    --tint: 10%;
    --soft: 18%;
    color-scheme: dark;
  }

  /* The level accent is chosen by body[data-level]; derived tints are computed on body. */
  body[data-level="A1"] { --accent: var(--lvl-A1); }
  body[data-level="A2"] { --accent: var(--lvl-A2); }
  body[data-level="B1"] { --accent: var(--lvl-B1); }
  body[data-level="B2"] { --accent: var(--lvl-B2); }
  body[data-level="C1"] { --accent: var(--lvl-C1); }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    --page-bg: color-mix(in srgb, var(--accent) var(--tint), var(--bg));
    --accent-soft: color-mix(in srgb, var(--accent) var(--soft), var(--surface));
    --accent-line: color-mix(in srgb, var(--accent) 40%, var(--border));
    --ok-soft: color-mix(in srgb, var(--ok) var(--soft), var(--surface));
    --bad-soft: color-mix(in srgb, var(--bad) var(--soft), var(--surface));
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--page-bg);
    color: var(--fg);
    font-family: var(--font);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.5;
    transition: background-color 0.3s ease;
  }

  [hidden] { display: none !important; }

  /* Top bar (Settings button), hidden on the quiz screen */
  .topbar {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 16px 0;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .icon-btn {
    width: 44px;
    height: 44px;
    min-height: 44px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .icon-btn svg { width: 20px; height: 20px; }

  main {
    flex: 1;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 8px 16px 32px;
  }

  .screen { animation: rise 0.22s ease-out; }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem);
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.2;
  }
  .subtitle, .breadcrumb { margin: 0 0 20px; color: var(--muted); }
  .breadcrumb { font-size: 0.95rem; }
  .breadcrumb:empty { display: none; }

  /* Buttons */
  button {
    font: inherit;
    font-weight: 500;
    color: inherit;
    min-height: 48px;
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
  }
  button:hover:not(:disabled) { border-color: var(--accent-line); background: var(--accent-soft); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover:not(:disabled) {
    background: color-mix(in srgb, var(--accent) 86%, var(--fg));
    border-color: color-mix(in srgb, var(--accent) 86%, var(--fg));
  }

  .back-btn {
    margin: 0 0 12px -8px;
    padding: 8px 14px 8px 8px;
    min-height: 44px;
    background: transparent;
    border-color: transparent;
    color: var(--muted);
  }
  .back-btn:hover:not(:disabled) { color: var(--fg); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }

  /* Menu grids: 2 columns on phones, auto-fill on wider screens */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
  .menu-btn {
    min-height: 72px;
    padding: 14px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }
  .menu-btn small { color: var(--muted); font-weight: 400; font-size: 0.9rem; }

  .level-btn {
    --chip: var(--accent);
    min-height: 96px;
    font-size: 1.6rem;
    letter-spacing: -0.01em;
    color: var(--chip);
    background: color-mix(in srgb, var(--chip) var(--soft), var(--surface));
    border-color: color-mix(in srgb, var(--chip) 35%, var(--border));
  }
  .level-btn:hover:not(:disabled) {
    background: color-mix(in srgb, var(--chip) calc(var(--soft) * 1.7), var(--surface));
    border-color: var(--chip);
  }

  /* Switch */
  .switch-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
    padding: 14px 16px;
    min-height: 56px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
  }
  .switch { position: relative; flex: none; width: 48px; height: 28px; }
  .switch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .slider {
    position: absolute;
    inset: 0;
    background: color-mix(in srgb, var(--fg) 22%, var(--surface));
    border-radius: 14px;
    pointer-events: none;
    transition: background-color 0.2s;
  }
  .switch .slider::before {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    background: var(--knob);
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    transition: transform 0.2s ease;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); background: var(--on-accent); }
  .switch input:focus-visible + .slider { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

  /* Quiz header */
  .quiz-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    color: var(--muted);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  #quiz-timer-text { color: var(--fg); }
  #quiz-timer-text.is-extension { color: var(--extra); }
  .timer-bar {
    height: 8px;
    margin-bottom: 20px;
    border-radius: 999px;
    overflow: hidden;
    background: color-mix(in srgb, var(--accent) 16%, var(--surface));
  }
  .timer-fill { height: 100%; width: 100%; border-radius: inherit; background: var(--accent); transition: width 0.1s linear; }
  .timer-bar.is-low .timer-fill { animation: pulse 1s ease-in-out infinite; }
  .timer-bar.is-extension { background: color-mix(in srgb, var(--extra) 16%, var(--surface)); }
  .timer-bar.is-extension .timer-fill {
    background: repeating-linear-gradient(-45deg, var(--extra) 0 8px, color-mix(in srgb, var(--extra) 70%, var(--surface)) 8px 16px);
  }

  .prompt { font-size: 1.25rem; font-weight: 500; line-height: 1.45; margin: 0 0 18px; }
  .instructions { color: var(--muted); margin: 0 0 12px; }
  .options { display: grid; gap: 10px; }
  .options.two { grid-template-columns: 1fr 1fr; }
  .option { min-height: 56px; text-align: left; font-size: 1.05rem; }
  .options.two .option { text-align: center; }

  .is-correct { background: var(--ok-soft) !important; border-color: var(--ok) !important; color: var(--ok) !important; }
  .is-wrong { background: var(--bad-soft) !important; border-color: var(--bad) !important; color: var(--bad) !important; }
  button.is-correct:disabled, button.is-wrong:disabled { opacity: 1; }
  .pop { animation: pop 0.32s ease-out; }

  .check-btn { width: 100%; margin-top: 4px; }
  @media (min-width: 600px) { .check-btn { width: auto; min-width: 160px; } }

  /* Fill in the blanks */
  .word-bank {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 66px;
    padding: 10px;
    margin-bottom: 18px;
    background: var(--accent-soft);
    border: 1.5px dashed var(--accent-line);
    border-radius: var(--radius-sm);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 8px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow);
    font-weight: 500;
  }
  .fill-sentence { line-height: 2.4; }
  /* Typed blank: fixed width so it never hints at the word's length */
  .blank-input {
    width: 9.5em;
    max-width: 100%;
    min-height: 46px;
    padding: 4px 10px;
    vertical-align: middle;
    font: inherit;
    color: var(--fg);
    background: color-mix(in srgb, var(--accent) 6%, var(--surface));
    border: none;
    border-bottom: 2px solid var(--accent);
    border-radius: 8px 8px 0 0;
    outline: none;
  }
  .blank-input:focus-visible { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-line); }
  .blank-input:disabled { opacity: 1; }
  .blank-input.is-partial { background: var(--accent-soft) !important; border-color: var(--accent) !important; }

  /* Matching */
  /* Phones: the word column is only as wide as its longest word (words never break), the meanings get
     the rest, and the pair badge sits on the top-right corner, so no text space is kept free for it.
     Wider screens: equal columns, badge inside the box on the right. */
  .match-columns { display: grid; grid-template-columns: auto 1fr; gap: var(--gap); margin-bottom: 16px; }
  .match-col { display: grid; gap: 10px; align-content: start; }
  .match-item { position: relative; min-height: 52px; padding: 10px 12px; text-align: left; overflow-wrap: anywhere; }
  .match-col:first-child .match-item { overflow-wrap: normal; }
  .match-item[data-pair] { border-color: var(--accent-line); }
  .match-item.is-selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .match-item[data-pair]::after {
    content: attr(data-pair);
    position: absolute;
    top: -8px;
    right: -8px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 0.8rem;
  }
  @media (min-width: 600px) {
    .match-columns { grid-template-columns: 1fr 1fr; }
    .match-item { padding: 12px 42px 12px 18px; }
    .match-item[data-pair]::after { top: 50%; right: 10px; width: 24px; height: 24px; transform: translateY(-50%); }
  }

  .feedback {
    margin: 16px 0;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    animation: rise 0.25s ease-out;
  }
  .feedback.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 40%, var(--surface)); }
  .feedback.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 40%, var(--surface)); }
  .feedback.partial { background: var(--accent-soft); border-color: var(--accent-line); }
  .feedback.ok strong { color: var(--ok); }
  .feedback.bad strong { color: var(--bad); }
  .feedback.partial strong { color: var(--accent); }
  .feedback .points { color: var(--muted); }
  .feedback p { margin: 4px 0; }
  .feedback strong { font-weight: 500; font-size: 1.1rem; }

  #quiz-next { width: 100%; }
  @media (min-width: 600px) { #quiz-next { width: auto; min-width: 160px; } }

  .actions { display: flex; flex-wrap: wrap; gap: var(--gap); margin-top: 16px; }
  .actions button { flex: 1 1 auto; }
  @media (min-width: 600px) { .actions button { flex: 0 0 auto; min-width: 140px; } }

  /* Results */
  .results-hero { text-align: center; }
  .results-score { margin: 4px 0 0; font-variant-numeric: tabular-nums; }
  .score-num { font-size: 3.5rem; font-weight: 500; line-height: 1.1; color: var(--accent); letter-spacing: -0.02em; }
  .score-max { font-size: 1.25rem; color: var(--muted); }
  .score-na { font-size: 1.5rem; font-weight: 500; color: var(--accent); }
  .results-summary { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
  .results-summary li { padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); font-size: 0.9rem; }
  .results-hero .actions { justify-content: center; }
  .results-list { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: var(--gap); }
  .results-list li {
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: var(--radius-sm);
  }
  .results-list li.st-correct { border-left-color: var(--ok); }
  .results-list li.st-incorrect { border-left-color: var(--bad); }
  .results-list li.st-partial { border-left-color: var(--accent); }
  .results-list p { margin: 2px 0; }
  .results-list strong { font-weight: 500; }
  .results-list .label { color: var(--muted); }

  /* Footer / credits */
  footer { padding: 16px 16px 28px; text-align: center; }
  .link-btn {
    min-height: 44px;
    background: none;
    border: none;
    color: var(--muted);
    font-weight: 400;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link-btn:hover:not(:disabled) { background: none; color: var(--accent); }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--overlay);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
  .modal {
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow: auto;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    animation: rise 0.2s ease-out;
  }
  .modal h2 { margin: 0 0 8px; font-size: 1.35rem; font-weight: 500; }
  .modal p { color: var(--muted); }
  .modal ul { padding-left: 20px; }
  /* "Words in this game" pop-up: word, type, meaning */
  .modal ul.word-list { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 8px; }
  .word-list li {
    padding: 8px 12px;
    background: var(--accent-soft);
    border-radius: var(--radius-sm);
  }
  .word-list .word { font-weight: 500; }
  .modal .word-list .word-sense { margin: 2px 0 0; color: var(--fg); }
  .word-list .word-type { margin-right: 4px; color: var(--muted); font-size: 0.85rem; font-style: italic; }
  /* the word type used in this game */
  .word-list .word-type.is-used {
    color: var(--fg);
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
  }

  /* Settings pop-up: one row per setting (name + control, short explanation underneath) */
  .settings { display: grid; gap: var(--gap); margin-top: 12px; }
  .setting { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .setting-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  label.setting-head { min-height: 44px; cursor: pointer; }
  .setting-name { font-weight: 500; }
  .modal .setting-help { margin: 4px 0 0; font-size: 0.9rem; color: var(--muted); }
  .segmented { display: flex; gap: 4px; margin-top: 8px; padding: 4px; background: var(--accent-soft); border-radius: var(--radius-sm); }
  .segmented button {
    flex: 1 1 0;
    min-height: 44px;
    padding: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    background: transparent;
    font-weight: 400;
  }
  .segmented button svg { width: 18px; height: 18px; flex: none; }
  .segmented button[aria-pressed="true"],
  .segmented button[aria-pressed="true"]:hover:not(:disabled) { background: var(--accent); color: var(--on-accent); font-weight: 500; }
  .settings-note { margin: 12px 0 0; text-align: center; font-size: 0.85rem; color: var(--muted); }

  .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 950; }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <button class="icon-btn" id="settings-btn" type="button" title="Settings" aria-label="Settings"></button>
</header>

<main id="app">

  <!-- Screen: level selection (root, no back button) -->
  <section id="screen-level" class="screen">
    <h1>My Game Project</h1>
    <p class="subtitle">Choose your level.</p>
    <div class="grid" id="level-buttons"></div>
  </section>

  <!-- Screen: category (Vocabulary / Grammar) -->
  <section id="screen-category" class="screen" hidden>
    <button class="back-btn" data-back="level">&larr; Back</button>
    <h1>What do you want to practice?</h1>
    <p class="breadcrumb"></p>
    <div class="grid" id="category-buttons"></div>
  </section>

  <!-- Screen: topic -->
  <section id="screen-topic" class="screen" hidden>
    <button class="back-btn" data-back="category">&larr; Back</button>
    <h1>Choose a topic</h1>
    <p class="breadcrumb"></p>
    <div class="grid" id="topic-buttons"></div>
  </section>

  <!-- Screen: question type -->
  <section id="screen-type" class="screen" hidden>

// Seeded RNG so the same quiz (level/category/topic/type) always yields the same questions.
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeLorem(rng) {
  const int = (min, max) => min + Math.floor(rng() * (max - min + 1));
  const shuffle = (arr) => {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  };
  const words = (n) => shuffle(LOREM_WORDS).slice(0, n);
  const capitalize = (w) => w.charAt(0).toUpperCase() + w.slice(1);
  const sentence = (min, max, end = '.') => {
    const w = words(int(min, max));
    w[0] = capitalize(w[0]);
    return w.join(' ') + end;
  };
  return { int, shuffle, words, capitalize, sentence, bool: () => rng() < 0.5 };
}

function playNote(ctx, note) {
  const t0 = ctx.currentTime + note.start;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = note.type || 'sine';
  osc.frequency.setValueAtTime(note.freq, t0);
  if (note.endFreq) osc.frequency.exponentialRampToValueAtTime(note.endFreq, t0 + note.duration);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(note.gain, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + note.duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + note.duration + 0.05);
}

function playSound(name) {
  const ctx = getAudio();
  if (!ctx) return;
  SOUNDS[name].forEach((note) => playNote(ctx, note));
}

function setMuted(muted) {
  sound.muted = muted;
  savePref('lg-muted', muted ? '1' : '0');
  refreshSettings();
}

function initSound() {
  // Browsers only allow audio after a user gesture: create/resume the context on the first one.
  const unlock = () => { if (!sound.muted) getAudio(); };
  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('keydown', unlock, true);
}

/* =========================================================================
 * CONFETTI  (results screen, high score only, skipped with reduced motion)
 * ========================================================================= */
let confetti = null;

function launchConfetti() {
  stopConfetti();
  if (prefersReducedMotion()) return;
  const canvas = el('canvas', { class: 'confetti', 'aria-hidden': 'true' });
  document.body.append(canvas);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const width = window.innerWidth;
  const height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);

  const styles = getComputedStyle(document.documentElement);
  const colors = CONFIG.LEVELS.map((l) => styles.getPropertyValue(`--lvl-${l}`).trim());
  const pieces = Array.from({ length: CONFIG.CONFETTI_COUNT }, () => ({
    x: Math.random() * width,
    y: -20 - Math.random() * height * 0.4,
    w: 6 + Math.random() * 4,
    h: 8 + Math.random() * 6,
    vx: (Math.random() - 0.5) * 1.2,
    vy: 1.8 + Math.random() * 2.2,
    rot: Math.random() * Math.PI,
    vr: (Math.random() - 0.5) * 0.15,
    color: colors[Math.floor(Math.random() * colors.length)],
  }));

  const start = performance.now();
  confetti = { canvas, raf: 0 };
  const frame = (now) => {
    const elapsed = now - start;
    if (elapsed >= CONFIG.CONFETTI_MS) {
      stopConfetti();
      return;
    }
    const fadeStart = CONFIG.CONFETTI_MS - 700;
    ctx.globalAlpha = elapsed > fadeStart ? 1 - (elapsed - fadeStart) / 700 : 1;
    ctx.clearRect(0, 0, width, height);
    for (const p of pieces) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    confetti.raf = requestAnimationFrame(frame);
  };
  confetti.raf = requestAnimationFrame(frame);
}

function stopConfetti() {
  if (!confetti) return;
  cancelAnimationFrame(confetti.raf);
  confetti.canvas.remove();
  confetti = null;
}

/* =========================================================================
 * QUESTIONS
 * ========================================================================= */
function quizKey(nav) {
  return `${nav.level}|${nav.category}|${nav.topic}|${nav.type}|${nav.difficulty}`;
}

// Stored shapes: the correct answer is first (mc options[0], fill bank[0]); prepareQuiz() shuffles.
function getQuestions(nav) {
  const bank = QUESTION_BANK[quizKey(nav)];
  if (nav.type === 'match') {
    // Matching quizzes have a variable length: use every question of the entry.
    if (bank && bank.length >= CONFIG.MATCH_MIN_QUESTIONS) return bank;
  } else if (bank && bank.length >= CONFIG.QUESTIONS_PER_QUIZ) {
    return bank.slice(0, CONFIG.QUESTIONS_PER_QUIZ);
  }
  return generateLoremQuestions(nav);
}

function generateLoremQuestions(nav) {
  const L = makeLorem(mulberry32(hashString(quizKey(nav))));
  const count = nav.type === 'match'
    ? L.int(CONFIG.MATCH_MIN_QUESTIONS, CONFIG.MATCH_MAX_LOREM_QUESTIONS)
    : CONFIG.QUESTIONS_PER_QUIZ;
  const questions = [];
  for (let i = 0; i < count; i++) {
    const explanation = L.sentence(10, 16);
    if (nav.type === 'mc') {
      questions.push({ type: 'mc', prompt: L.sentence(6, 10, '?'), options: L.words(CONFIG.MC_OPTIONS), explanation });
    } else if (nav.type === 'tf') {
      const prompt = L.sentence(6, 10);
      questions.push({ type: 'tf', prompt, answer: i % 2 === 0, target: prompt.split(' ')[1], explanation });
    } else if (nav.type === 'fill') {
      const length = L.int(6, 9);                        // words in sentence incl. the blank
      const bankSize = L.int(CONFIG.FILL_BANK_MIN, CONFIG.FILL_BANK_MAX);
      const all = L.words(length - 1 + bankSize);
      const sentenceWords = all.slice(0, length - 1);
      const bankWords = all.slice(length - 1);           // bankWords[0] is the answer
      const pos = L.int(1, length - 2);                  // blank never first or last
      sentenceWords[0] = L.capitalize(sentenceWords[0]);
      questions.push({
        type: 'fill',
        before: sentenceWords.slice(0, pos).join(' '),
        after: sentenceWords.slice(pos).join(' ') + '.',
        answer: bankWords[0],
        bank: bankWords,
        explanation,
      });
    } else if (nav.type === 'match') {
      const w = L.words(CONFIG.MATCH_PAIRS * 2);
      const pairs = [];
      for (let p = 0; p < CONFIG.MATCH_PAIRS; p++) pairs.push({ left: w[p], right: w[p + CONFIG.MATCH_PAIRS] });
      questions.push({ type: 'match', prompt: L.sentence(5, 8), pairs, explanation });
    }
  }
  // Lorem true/false: 4 true and 4 false in a mixed (seeded) order, like real quizzes.
  return nav.type === 'tf' ? L.shuffle(questions) : questions;
}

/*
 * Mindful shuffling, seeded by the quiz key so Retry shows exactly the same quiz.
 * Returns copies; the stored questions are never changed.
 * - mc: each position holds the correct answer equally often (8 questions → each position twice),
 *       never more than MC_MAX_SAME_POSITION_IN_A_ROW times in a row. Sets q.answer (index).
 * - fill: bank order shuffled.
 * - match: right-side order shuffled, never the same order as the left side. Sets q.rightOrder.
 */
function prepareQuiz(questions, key) {
  const L = makeLorem(mulberry32(hashString(`shuffle|${key}`)));
  const mcCount = questions.filter((q) => q.type === 'mc').length;
  const positions = balancedPositions(mcCount, CONFIG.MC_OPTIONS, CONFIG.MC_MAX_SAME_POSITION_IN_A_ROW, L);
  let mcIndex = 0;
  return questions.map((q) => {
    if (q.type === 'mc') {
      const [correct, ...wrong] = q.options;
      const options = L.shuffle(wrong);
      const answer = positions[mcIndex++];
      options.splice(answer, 0, correct);
      return { ...q, options, answer };
    }
    if (q.type === 'fill') return { ...q, bank: L.shuffle(q.bank) };
    if (q.type === 'match') {
      const identity = q.pairs.map((_, i) => i);
      let order = L.shuffle(identity);
      while (order.every((v, i) => v === i)) order = L.shuffle(identity);
      return { ...q, rightOrder: order };
    }
    return { ...q };
  });
}

function balancedPositions(count, slots, maxRun, L) {
  const list = Array.from({ length: count }, (_, i) => i % slots);
  const runTooLong = (arr) => arr.some((_, i) => i >= maxRun && arr.slice(i - maxRun, i + 1).every((v) => v === arr[i]));
  let order = L.shuffle(list);
  for (let tries = 0; tries < 200 && runTooLong(order); tries++) order = L.shuffle(list);
  return order;
}

// Spelling: optimal string alignment distance (insert, delete, replace, or swap of two neighbors = 1).
function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
  }
  return d[a.length][b.length];
}

function normalizeAnswer(text) {
  return text.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[‘’]/g, "'");
}

// Typed fill answer → 'correct' | 'misspelled' | 'incorrect' (see README.md "Typed Fill in the Blanks").
function judgeFill(input, q) {
  const typed = normalizeAnswer(input);
  const answer = normalizeAnswer(q.answer);
  const others = q.bank.map(normalizeAnswer).filter((w) => w !== answer);
  if (typed === answer) return 'correct';
  if (others.includes(typed)) return 'incorrect';
  const allowed = answer.length <= CONFIG.SPELL_SHORT_MAX_LENGTH ? CONFIG.SPELL_MAX_EDITS_SHORT : CONFIG.SPELL_MAX_EDITS_LONG;
  const toAnswer = editDistance(typed, answer);
  const closerToAnswer = others.every((w) => toAnswer < editDistance(typed, w));
  return toAnswer <= allowed && closerToAnswer ? 'misspelled' : 'incorrect';
}

function questionText(q) {
  if (q.type === 'fill') return `${fillBefore(q.before)}___${fillAfter(q.after)}`;
  return q.prompt;
}

function correctAnswerText(q) {
  if (q.type === 'mc') return q.options[q.answer];
  if (q.type === 'tf') return q.answer ? 'True' : 'False';
  if (q.type === 'fill') return q.answer;
  if (q.type === 'match') return q.pairs.map((p) => `${p.left} → ${p.right}`).join('; ');
  return '';
}

const SCREEN_DEPTH = { level: 0, category: 1, topic: 2, type: 3, difficulty: 4, quiz: 5, results: 5 };

function breadcrumbParts() {
  const nav = state.nav;
  const difficulty = findById(CONFIG.DIFFICULTIES, nav.difficulty);
  return [
    nav.level,
    findById(CONFIG.CATEGORIES, nav.category)?.label,
    nav.topic !== null ? getTopics(nav)[nav.topic] : null,
    findById(CONFIG.TYPES, nav.type)?.label,
    difficulty ? `${difficulty.label} (${getQuestionSeconds()}s)` : null,
  ];
}

function showScreen(name) {
  stopConfetti();
  document.querySelectorAll('.screen').forEach((s) => { s.hidden = s.id !== `screen-${name}`; });

  if (name === 'level') delete document.body.dataset.level;
  else if (state.nav.level) document.body.dataset.level = state.nav.level;
  // Credits and the theme/mute bar are shown on every page except the game (quiz) page.
  $('#credits-footer').hidden = name === 'quiz';

  if (crumb) crumb.textContent = breadcrumbParts().slice(0, SCREEN_DEPTH[name]).join(' › ');

    const btn = el('button', { class: 'menu-btn' }, [item.label]);

    return btn;

// The "same duration" switch lives on the Difficulty screen and in Settings; both always show this one value.

/* =========================================================================
 * QUIZ FLOW
 * ========================================================================= */
function startQuiz() {
  stopTimer();
  closeModal();
  const questions = prepareQuiz(getQuestions(state.nav), quizKey(state.nav));
  state.quiz = {
    questions,
    index: 0,
    score: 0,                                   // raw running score, may go negative
    graded: !CONFIG.UNGRADED_TYPES.includes(state.nav.type),
    records: questions.map(() => ({
      status: 'unanswered',                     // correct | partial | incorrect | skipped | unanswered
      userAnswer: null,
      note: null,                               // partial: "Check your spelling…" / "2 of 4 pairs"
      points: 0,                                // points from answering
      penalty: 0,                               // points lost to the time extension
      extensionUsed: false,
      timedOut: false,                          // true if this question ended the game
    })),
    timer: { totalMs: 0, remainingMs: 0, intervalId: null, lastTs: 0, extension: false, lastTickSecond: null },
    answered: false,                            // current question locked?
    over: false,
    ui: {},                                     // per-question renderer state
  };
  showScreen('quiz');
  // The "Words in this game" pop-up comes first (also on Retry); the timer starts when it closes.
  $('#quiz-question').replaceChildren();
  $('#quiz-feedback').hidden = true;
  $('#quiz-next').hidden = true;
  openWordPreview(() => { closeModal(); renderQuestion(); });
}

// The words a quiz tests, in order of appearance, without repeats: [{ word, type }].
// type = the word type used in this quiz (q.targetType / pair.type); needed when a word has several types.
// q.target (optional on mc / fill) = the dictionary form when the answer is another form ("laughs" -> "laugh").
function quizTargetWords(questions) {
  const words = new Map();
  const add = (word, type) => { if (word && !words.has(word)) words.set(word, { word, type: type || null }); };
  questions.forEach((q) => {
    if (q.type === 'mc') add(q.target || q.options[q.answer], q.targetType);
    else if (q.type === 'fill') add(q.target || q.answer, q.targetType);
    else if (q.type === 'tf') add(q.target, q.targetType);
    else if (q.type === 'match') q.pairs.forEach((p) => add(p.left, p.type));
  });
  return [...words.values()];
}

// All senses of a word from GLOSSARY[level]: [{ type, meaning }]. An entry is one sense (object) or several
// (array, one per word type). Lorem quizzes get a lorem placeholder.
function glossarySenses(level, word) {
  const entry = (GLOSSARY[level] || {})[word.toLowerCase()];
  if (entry) return [].concat(entry);
  const L = makeLorem(mulberry32(hashString(`glossary|${word}`)));
  return [{ type: L.words(1)[0], meaning: L.sentence(3, 6, '') }];
}

function openWordPreview(start) {
  const level = state.nav.level;
  const list = el('ul', { class: 'word-list' }, quizTargetWords(state.quiz.questions).map(({ word, type }) => {
    const senses = glossarySenses(level, word);
    const used = type || senses[0].type;   // one sense: that one is used
    // Every word type of the word is shown; the one used in this game is underlined.
    return el('li', {}, [
      el('span', { class: 'word', text: word }),
      ...senses.map((s) => el('p', { class: 'word-sense' }, [
        el('span', { class: `word-type${s.type === used ? ' is-used' : ''}`, text: s.type }),
        ` ${s.meaning}`,
      ])),
    ]);
  }));
  openModal({
    title: 'Words in this game',
    body: list,
    buttons: [{ label: 'Start', primary: true, onClick: start }],
  });
}

function currentQuestion() {
  return state.quiz.questions[state.quiz.index];
}

function currentRecord() {
  return state.quiz.records[state.quiz.index];
}

function renderQuestion() {
  const quiz = state.quiz;
  const q = currentQuestion();
  quiz.answered = false;
  quiz.ui = {};
  $('#quiz-progress').textContent = `Question ${quiz.index + 1} / ${quiz.questions.length}`;
  updateScoreDisplay();
  $('#quiz-feedback').hidden = true;
  $('#quiz-next').hidden = true;
  const area = $('#quiz-question');
  area.replaceChildren();
  RENDERERS[q.type](q, area);
  startTimer(getQuestionSeconds(), false);
}

function updateScoreDisplay() {
  const quiz = state.quiz;
  $('#quiz-score').textContent = quiz.graded ? `Score: ${fmt(quiz.score)}` : 'Score: not graded yet';
}

/*
 * outcome: 'correct' | 'partial' | 'incorrect'. points: what the answer earns (renderers compute it,
 * see questionPoints()). note: shown for partial answers (spelling warning, pairs count).
 */
function submitAnswer(outcome, userAnswer, points, note = null) {
  const quiz = state.quiz;
  if (!quiz || quiz.answered) return;
  quiz.answered = true;
  stopTimer();

  const q = currentQuestion();
  const rec = currentRecord();
  rec.status = outcome;
  rec.userAnswer = userAnswer;
  rec.note = note;
  if (quiz.graded) {
    rec.points = points;
    quiz.score += rec.points;
  }
  updateScoreDisplay();
  playSound({ correct: 'correct', partial: 'partial', incorrect: 'wrong' }[outcome]);

  const area = $('#quiz-question');
  area.querySelectorAll('button, input').forEach((b) => { b.disabled = true; });
  // Renderers mark the right element(s) with .is-correct before calling submitAnswer.
  if (outcome === 'correct') area.querySelectorAll('.is-correct').forEach((node) => node.classList.add('pop'));

  const fb = $('#quiz-feedback');
  fb.className = `feedback ${{ correct: 'ok', partial: 'partial', incorrect: 'bad' }[outcome]}`;
  const heading = { correct: 'Correct!', partial: q.type === 'fill' ? 'Almost!' : 'Partly correct.', incorrect: 'Incorrect.' }[outcome];
  const lines = [el('p', {}, [el('strong', { text: heading })])];
  if (note) lines.push(el('p', { text: note }));
  if (outcome === 'correct') {
    lines.push(el('p', { text: `Answer: ${correctAnswerText(q)}` }));
  } else {
    lines.push(el('p', { text: `Correct answer: ${correctAnswerText(q)}` }));
    lines.push(el('p', { text: `Explanation: ${q.explanation}` }));
  }
  if (quiz.graded) lines.push(el('p', { class: 'points', text: `Points: ${points > 0 ? '+' : ''}${fmt(points)}` }));
  fb.replaceChildren(...lines);
  fb.hidden = false;

  const next = $('#quiz-next');
  next.textContent = quiz.index === quiz.questions.length - 1 ? 'See results' : 'Next';
  next.hidden = false;
  next.focus();
}

function goNext() {
  const quiz = state.quiz;
  if (quiz.index < quiz.questions.length - 1) {
    quiz.index++;
    renderQuestion();
  } else {
    showResults();
  }
}

function skipQuestion() {
  const quiz = state.quiz;
  quiz.answered = true;
  currentRecord().status = 'skipped';
  goNext();
}

function requestQuit() {
  const quiz = state.quiz;
  const wasRunning = quiz.timer.intervalId !== null;
  pauseTimer();
  openModal({
    title: 'Quit quiz?',
    body: 'Your answers in this quiz will be lost.',
    buttons: [
      { label: 'Cancel', primary: true, onClick: () => { closeModal(); if (wasRunning) resumeTimer(); } },
      { label: 'Quit', onClick: () => { closeModal(); stopTimer(); state.quiz = null; showScreen('difficulty'); } },
    ],
  });
}

/* =========================================================================
 * TIMER  (time-based, so pausing keeps the exact remaining milliseconds)
 * ========================================================================= */
function startTimer(seconds, extension) {
  stopTimer();
  const t = state.quiz.timer;
  t.totalMs = seconds * 1000;
  t.remainingMs = t.totalMs;
  t.extension = extension;
  t.lastTickSecond = null;
  resumeTimer();
}

function resumeTimer() {
  const t = state.quiz.timer;
  if (t.intervalId !== null || t.remainingMs <= 0) return;
  t.lastTs = performance.now();
  t.intervalId = setInterval(tick, CONFIG.TIMER_TICK_MS);
  renderTimer();
}

function pauseTimer() {
  const t = state.quiz && state.quiz.timer;
  if (!t || t.intervalId === null) return;
  t.remainingMs = Math.max(0, t.remainingMs - (performance.now() - t.lastTs));
  stopTimer();
}

function stopTimer() {
  const t = state.quiz && state.quiz.timer;
  if (!t || t.intervalId === null) return;
  clearInterval(t.intervalId);
  t.intervalId = null;
}

function tick() {
  const quiz = state.quiz;
  if (!quiz) return;
  const t = quiz.timer;
  const now = performance.now();
  t.remainingMs -= now - t.lastTs;
  t.lastTs = now;
  if (t.remainingMs <= 0) {
    t.remainingMs = 0;
    stopTimer();
    renderTimer();
    onTimeUp();
    return;
  }
  // Quiet tick once per second in the last TICK_LAST_SECONDS (normal and extra time).
  const secondsLeft = Math.ceil(t.remainingMs / 1000);
  if (secondsLeft <= CONFIG.TICK_LAST_SECONDS && secondsLeft !== t.lastTickSecond) {
    t.lastTickSecond = secondsLeft;
    playSound('tick');
  }
  renderTimer();
}

function renderTimer() {
  const t = state.quiz.timer;
  const ratio = t.totalMs ? t.remainingMs / t.totalMs : 0;
  const text = $('#quiz-timer-text');
  text.textContent = `${t.extension ? 'Extra time' : 'Time'}: ${Math.ceil(t.remainingMs / 1000)}s`;
  text.classList.toggle('is-extension', t.extension);
  $('#quiz-timer-fill').style.width = `${ratio * 100}%`;
  const bar = $('#quiz-timer-bar');
  bar.classList.toggle('is-extension', t.extension);
  bar.classList.toggle('is-low', !t.extension && ratio < CONFIG.TIMER_LOW_RATIO);
}

function onTimeUp() {
  const quiz = state.quiz;
  if (quiz.answered) return;
  const rec = currentRecord();
  if (!rec.extensionUsed) {
    openModal({
      title: 'Time out',
      body: quiz.graded
        ? `Time is up! Take ${CONFIG.EXTENSION_SECONDS} more seconds (−${CONFIG.EXTENSION_PENALTY} points) or skip this question.`
        : `Time is up! Take ${CONFIG.EXTENSION_SECONDS} more seconds or skip this question.`,
      buttons: [
        {
          label: quiz.graded
            ? `+${CONFIG.EXTENSION_SECONDS} seconds (−${CONFIG.EXTENSION_PENALTY} points)`
            : `+${CONFIG.EXTENSION_SECONDS} seconds`,
          primary: true,
          onClick: () => { closeModal(); useExtension(); },
        },
        { label: 'Skip question', onClick: () => { closeModal(); skipQuestion(); } },
      ],
    });
  } else {
    gameOver();
  }
}

function useExtension() {
  const quiz = state.quiz;
  const rec = currentRecord();
  rec.extensionUsed = true;
  if (quiz.graded) {
    rec.penalty = -CONFIG.EXTENSION_PENALTY;
    quiz.score += rec.penalty;
  }
  updateScoreDisplay();
  startTimer(CONFIG.EXTENSION_SECONDS, true);
}

function gameOver() {
  const quiz = state.quiz;
  quiz.answered = true;
  quiz.over = true;
  currentRecord().timedOut = true;
  $('#quiz-question').querySelectorAll('button, input').forEach((b) => { b.disabled = true; });
  openModal({
    title: 'Game over',
    body: 'Time is up again, so the quiz ends here. Try again or see your results.',
    buttons: [
      { label: 'Retry', primary: true, onClick: () => { closeModal(); startQuiz(); } },
      { label: 'See results', onClick: () => { closeModal(); showResults(); } },
    ],
  });
}

/* =========================================================================
 * RENDERERS (one per question type)
 * ========================================================================= */
function renderChoiceButtons(area, labels, correctIndex, onPick, extraClass = '') {
  const wrap = el('div', { class: `options ${extraClass}`.trim() });
  labels.forEach((label, i) => {
    const btn = el('button', { class: 'option', text: label });
    btn.addEventListener('click', () => {
      if (state.quiz.answered) return;
      const correct = i === correctIndex;
      btn.classList.add(correct ? 'is-correct' : 'is-wrong');
      wrap.children[correctIndex].classList.add('is-correct');
      onPick(correct, label);
    });
    wrap.append(btn);
  });
  area.append(wrap);
}

// Points for multiple choice / true or false / fill: +POINTS_CORRECT or −POINTS_INCORRECT.
function choicePoints(correct) {
  return correct ? CONFIG.POINTS_CORRECT : -CONFIG.POINTS_INCORRECT;
}

function submitChoice(correct, label) {
  submitAnswer(correct ? 'correct' : 'incorrect', label, choicePoints(correct));
}

function renderMC(q, area) {
  area.append(el('p', { class: 'prompt', text: q.prompt }));
  renderChoiceButtons(area, q.options, q.answer, submitChoice);
}

function renderTF(q, area) {
  area.append(el('p', { class: 'prompt', text: q.prompt }));
  renderChoiceButtons(area, ['True', 'False'], q.answer ? 0 : 1, submitChoice, 'two');
}

// Typed fill: the word bank is shown above the sentence; the student types one word into the blank.
// Spaces around the blank like normal print: none after an opening quote ("___) and none before
// punctuation or a closing quote (___. / ___!" / ___,).
function fillBefore(text) { return !text || text.endsWith('"') ? text || '' : `${text} `; }
function fillAfter(text) { return !text || /^[.,!?;:"']/.test(text) ? text || '' : ` ${text}`; }

function renderFill(q, area) {
  const bank = el('div', { class: 'word-bank' }, q.bank.map((word) => el('span', { class: 'chip', text: word })));
  const input = el('input', {
    class: 'blank-input',
    type: 'text',
    autocomplete: 'off',
    autocorrect: 'off',
    autocapitalize: 'off',
    spellcheck: 'false',
    enterkeyhint: 'done',
    'aria-label': 'Your answer',
  });
  const check = el('button', { class: 'primary check-btn', text: 'Check', disabled: true });
  const submit = () => {
    const typed = input.value.trim();
    if (!typed || state.quiz.answered) return;
    const result = judgeFill(typed, q);
    if (result === 'correct') {
      input.classList.add('is-correct');
      submitAnswer('correct', typed, CONFIG.POINTS_CORRECT);
    } else if (result === 'misspelled') {
      input.classList.add('is-partial');
      submitAnswer('partial', typed, CONFIG.POINTS_CORRECT * CONFIG.FILL_MISSPELLED_SHARE,
        `Check your spelling: "${q.answer}", not "${typed}".`);
    } else {
      input.classList.add('is-wrong');
      submitAnswer('incorrect', typed, -CONFIG.POINTS_INCORRECT);
    }
  };
  input.addEventListener('input', () => { check.disabled = !input.value.trim(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  check.addEventListener('click', submit);
  area.append(
    el('p', { class: 'instructions', text: 'Type the missing word.' }),
    bank,
    el('p', { class: 'prompt fill-sentence' }, [fillBefore(q.before), input, fillAfter(q.after)]),
    check,
  );
  state.quiz.ui = { input, check };
  input.focus({ preventScroll: true });
}

function renderMatch(q, area) {
  const ui = { selectedLeft: null, pairs: new Map(), leftBtns: [], rightBtns: [] };
  const leftCol = el('div', { class: 'match-col' });
  const rightCol = el('div', { class: 'match-col' });

  const refresh = () => {
    ui.leftBtns.forEach((btn, i) => {
      btn.classList.toggle('is-selected', ui.selectedLeft === i);
      if (ui.pairs.has(i)) btn.dataset.pair = i + 1; else delete btn.dataset.pair;
    });
    ui.rightBtns.forEach((btn, ri) => {
      const left = [...ui.pairs].find(([, r]) => r === ri);
      if (left) btn.dataset.pair = left[0] + 1; else delete btn.dataset.pair;
    });
    ui.check.disabled = ui.pairs.size !== q.pairs.length;
  };

  q.pairs.forEach((pair, i) => {
    const btn = el('button', { class: 'match-item', text: pair.left });
    btn.addEventListener('click', () => {
      if (state.quiz.answered) return;
      if (ui.pairs.has(i)) {
        ui.pairs.delete(i);                       // clicking a paired item undoes the pair
        ui.selectedLeft = null;
      } else {
        ui.selectedLeft = ui.selectedLeft === i ? null : i;
      }
      refresh();
    });
    ui.leftBtns[i] = btn;
    leftCol.append(btn);
  });

  q.rightOrder.forEach((ri) => {
    const btn = el('button', { class: 'match-item', text: q.pairs[ri].right });
    btn.addEventListener('click', () => {
      if (state.quiz.answered) return;
      const existing = [...ui.pairs].find(([, r]) => r === ri);
      if (existing) {
        ui.pairs.delete(existing[0]);
      } else if (ui.selectedLeft !== null) {
        ui.pairs.set(ui.selectedLeft, ri);
        ui.selectedLeft = null;
      }
      refresh();
    });
    ui.rightBtns[ri] = btn;
    rightCol.append(btn);
  });

  ui.check = el('button', { class: 'primary check-btn', text: 'Check', disabled: true });
  ui.check.addEventListener('click', () => {
    if (state.quiz.answered) return;
    let correctPairs = 0;
    q.pairs.forEach((_, i) => {
      const ri = ui.pairs.get(i);
      const ok = ri === i;
      if (ok) correctPairs++;
      ui.leftBtns[i].classList.add(ok ? 'is-correct' : 'is-wrong');
      ui.rightBtns[ri].classList.add(ok ? 'is-correct' : 'is-wrong');
    });
    const userAnswer = q.pairs.map((p, i) => `${p.left} → ${q.pairs[ui.pairs.get(i)].right}`).join('; ');
    // Partial points: the quiz is worth SCORE_MAX in total; each correct pair earns its share. No penalty.
    const points = (CONFIG.SCORE_MAX / state.quiz.questions.length) * (correctPairs / q.pairs.length);
    const outcome = correctPairs === q.pairs.length ? 'correct' : correctPairs > 0 ? 'partial' : 'incorrect';
    const note = outcome === 'partial' ? `${correctPairs} of ${q.pairs.length} pairs are correct.` : null;
    submitAnswer(outcome, userAnswer, points, note);
  });

  area.append(
    el('p', { class: 'prompt', text: q.prompt }),
    el('div', { class: 'match-columns' }, [leftCol, rightCol]),
    ui.check,
  );
  state.quiz.ui = ui;
  refresh();
}

const RENDERERS = { mc: renderMC, tf: renderTF, fill: renderFill, match: renderMatch };

/* =========================================================================
 * RESULTS
 * ========================================================================= */
function statusLabel(rec, graded, type) {
  const pts = (n) => (graded ? ` (${n > 0 ? '+' : ''}${fmt(n)})` : ' (not graded)');
  if (rec.status === 'correct') return `Correct${pts(rec.points)}`;
  if (rec.status === 'partial') return `${type === 'fill' ? 'Misspelled' : 'Partly correct'}${pts(rec.points)}`;
  if (rec.status === 'incorrect') return `Incorrect${pts(rec.points)}`;
  if (rec.status === 'skipped') return 'Skipped (0)';
  return rec.timedOut ? 'Time ran out — game over' : 'Not answered';
}

function showResults() {
  stopTimer();
  const quiz = state.quiz;
  const counts = { correct: 0, partial: 0, incorrect: 0, skipped: 0, unanswered: 0 };
  quiz.records.forEach((r) => { counts[r.status]++; });
  const finalScore = clampScore(quiz.score);
  const type = state.nav.type;

  $('#results-score').replaceChildren(...(quiz.graded
    ? [el('span', { class: 'score-num', text: fmt(finalScore) }), el('span', { class: 'score-max', text: ` / ${CONFIG.SCORE_MAX}` })]
    : [el('span', { class: 'score-na', text: 'Score: not graded yet' })]));
  $('#results-summary').replaceChildren(
    el('li', { text: `Correct: ${counts.correct}` }),
    ...(counts.partial ? [el('li', { text: `${type === 'fill' ? 'Misspelled' : 'Partly correct'}: ${counts.partial}` })] : []),
    el('li', { text: `Incorrect: ${counts.incorrect}` }),
    el('li', { text: `Skipped: ${counts.skipped}` }),
    el('li', { text: `Not answered: ${counts.unanswered}` }),
  );

  $('#results-list').replaceChildren(...quiz.questions.map((q, i) => {
    const rec = quiz.records[i];
    const row = (label, value) => el('p', {}, [el('span', { class: 'label', text: `${label}: ` }), value]);
    const children = [
      el('p', {}, [el('strong', { text: `Q${i + 1}. ${questionText(q)}` })]),
      row('Your answer', rec.userAnswer ?? '—'),
      row('Correct answer', correctAnswerText(q)),
      row('Result', statusLabel(rec, quiz.graded, q.type)),
    ];
    if (rec.note) children.push(row('Note', rec.note));
    if (rec.extensionUsed) {
      children.push(row('Extra time', quiz.graded ? `used (${fmt(rec.penalty)})` : 'used'));
    }
    children.push(row('Explanation', q.explanation));
    return el('li', { class: `st-${rec.status}` }, children);
  }));

  showScreen('results');
  const minScore = type === 'match' ? CONFIG.CONFETTI_MIN_MATCH_SCORE : CONFIG.CONFETTI_MIN_SCORE;
  if (quiz.graded && finalScore >= minScore) launchConfetti();
}

/* =========================================================================
 * INIT
 * ========================================================================= */
initTheme();
initSound();
initMenus();
initModal();
showScreen('level');
</script>
